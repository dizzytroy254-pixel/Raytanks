<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<title>RAYTANKS</title>
<script src="https://cdn.jsdelivr.net/npm/planck@1/dist/planck.min.js"></script>
<style>
:root{--g:rgba(255,255,255,.14);--gb:rgba(255,255,255,.32)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#fff;background:#0a0f1f}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 12% 8%,#3b6cff 0,transparent 60%),radial-gradient(50% 45% at 92% 18%,#ff5fa8 0,transparent 60%),radial-gradient(60% 55% at 60% 100%,#17c9a6 0,transparent 60%),#0a0f1f}
main{max-width:1900px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-radius:999px}
.btn{color:#fff;text-decoration:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}.btn:hover{background:rgba(255,255,255,.25)}
.score{display:flex;align-items:baseline;gap:10px;font-weight:700}.score b{font-size:28px;font-variant-numeric:tabular-nums}.score span{font-size:13px;opacity:.8;font-weight:600}.score i{opacity:.4;font-style:normal}
#rd{font-size:14px;font-weight:600;opacity:.9;min-width:80px;text-align:right}
.stage{position:relative;border-radius:34px;padding:10px;background:rgba(18,22,38,.6);border:1px solid var(--gb);box-shadow:0 18px 50px rgba(0,0,0,.35)}
canvas{display:block;height:auto;margin:0 auto;border-radius:26px}
#ov{--a:#fff;--b:#8fd3ff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-style:italic;letter-spacing:6px;text-align:center;pointer-events:none;opacity:0;white-space:nowrap;font-size:clamp(44px,10vw,120px);line-height:1.1;background:linear-gradient(180deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 28px rgba(0,0,0,.55))}
#ov.show{opacity:1;animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
#ov.r1{--b:#ffe27a}#ov.r2{--a:#fff4d6;--b:#ff6a4d}
#ov.top{top:54px;transform:translateX(-50%);font-size:clamp(26px,4.4vw,48px);letter-spacing:3px;--b:#ff8a8a}#ov.top.show{animation:drop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;border-radius:26px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:14px;transition:opacity .3s}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}.chip small{opacity:.65;font-weight:500}
.chip .kw{padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.28);font-weight:800;font-variant-numeric:tabular-nums}
.chip.dead{opacity:.4}.chip.dead b{text-decoration:line-through}
.hint{margin:0;text-align:center;font-size:13px;opacity:.7}
</style>
</head>
<body>
<main>
  <header class="glass bar">
    <a class="btn glass" href="../index.html">‹ Home</a>
    <div class="score" id="sc"><b id="sy">0</b><span>You</span><i>:</i><span id="an">AI</span><b id="sa">0</b></div>
    <div id="rd">Round 1</div>
  </header>
  <div class="glass stage"><canvas id="c"></canvas><div id="ov"></div></div>
  <footer class="glass roster" id="ro"></footer>
  <p class="hint"></p>
</main>
<script>
const S=88,T=8,P=22,D=[[0,1],[1,0],[0,-1],[-1,0]],PPM=30,SPD=2.5,BS=SPD*1.25,CLOSE=420;
let COLS=11,ROWS=7;
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d',{alpha:false,desynchronized:true}),ov=$('ov'),ro=$('ro'),hint=document.querySelector('.hint');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),angd=(a,b)=>((a-b+9.4248)%6.2832)-3.1416,rnd=n=>Math.random()*n|0;
const Q=new URLSearchParams(location.search),LV=+(Q.get('d')||2),CAMP=!!Q.get('camp'),TEST=!!Q.get('test');
const KINDS=[{id:'rex',name:'Rex',role:'Hunter',color:'#ff5a52',cap:3,react:6},{id:'vex',name:'Vex',role:'Sniper',color:'#ffc233',cap:2,react:4},
 {id:'zip',name:'Zip',role:'Phantom',color:'#a67bff',cap:2,react:0},{id:'ash',name:'Ash',role:'Ambusher',color:'#2fd08a',cap:3,react:4},
 {id:'echo',name:'Echo',role:'Mimic',color:'#ff7ad9',cap:3,react:2,echo:1}];
const ME={id:'you',name:'You',role:'Player',color:'#22d3ee',cap:5};
const ids=(Q.get('ai')||'rex,vex,zip,ash').split(',');let ACTIVE=KINDS.filter(k=>ids.includes(k.id));if(!ACTIVE.length)ACTIVE=KINDS.slice(0,4);
const DIFF=[{every:30,rm:3,fm:2.5,lead:0,wob:.12},{every:16,rm:1.6,fm:1.4,lead:0,wob:.09},{every:8,rm:1,fm:1,lead:.5,wob:.06},{every:4,rm:0,fm:.8,lead:1,wob:.04}],dq=DIFF[LV]||DIFF[2];
let MEM=[],HEAT={},CTRL='wasd',FFA=false,mute=0;const ST={};
try{MEM=JSON.parse(localStorage.raytanks_mem||'[]').filter(m=>m.f&&m.f.length===8);HEAT=JSON.parse(localStorage.raytanks_heat||'{}');if(Array.isArray(HEAT))HEAT={};CTRL=localStorage.raytanks_ctrl||'wasd';FFA=localStorage.raytanks_ffa==='1'}catch(e){}
const saveMem=()=>{try{localStorage.raytanks_mem=JSON.stringify(MEM.slice(-3000));localStorage.raytanks_heat=JSON.stringify(HEAT)}catch(e){}};
let BX=!!window.planck;const V=BX?(x,y)=>new planck.Vec2(x,y):null;
let walls=[],grid=[],cells=[],tanks=[],bullets=[],state='menu',timer=0,round=0,layer=null,world=null,FT=-1,FF=[],SB=1,SHK=0,PT=[],EX=[],IA=0,scoring=true,elim=false,RB=0,RL=0;
const keys={};

// ---------- audio (layered synth, compressed master) ----------
let AC,MG;const au=()=>{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=.7;MG.connect(c);c.connect(AC.destination)}return AC};
function tone(f,d=.1,ty='sine',v=.15,sl=0,dl=0){if(mute)return;try{const c=au(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,f0,f1,v,ty='lowpass'){if(mute)return;try{const c=au(),n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n)**2;
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;s.buffer=b;f.type=ty;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.value=v;s.connect(f).connect(g).connect(MG);s.start(t)}catch(e){}}
const sShot=v=>{tone(200,.14,'sine',.24*v,-140);noise(.05,2800,900,.16*v,'bandpass')},sBoom=()=>{noise(.65,1500,80,.6);tone(95,.55,'sine',.45,-60);noise(.14,5200,1500,.22,'highpass')};
let lastPing=0;const sPing=v=>{const n=performance.now();if(n-lastPing<45)return;lastPing=n;tone(1500,.05,'triangle',.05*v,-500)};
const sBeat=i=>{if(i<2)tone(i?523:392,.2,'triangle',.2);else{tone(659,.35,'triangle',.22);tone(988,.35,'triangle',.18);noise(.25,600,3000,.14,'bandpass')}};

// ---------- maze ----------
const cellOf=t=>({r:clamp(t.y/S|0,0,ROWS-1),c:clamp(t.x/S|0,0,COLS-1)});
function opn(r,c,dr,dc){const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)return false;if(dc==1)return!cells[r*COLS+c].R;if(dc==-1)return!cells[r*COLS+nc].R;if(dr==1)return!cells[r*COLS+c].B;return!cells[nr*COLS+c].B}
const sizeFor=n=>n<=2?[8,5]:n===3?[9,6]:n===4?[10,6]:n===5?[11,7]:[12,7];
function makeMaze(){[COLS,ROWS]=sizeFor(1+ACTIVE.length);cv.width=COLS*S+2*P;cv.height=ROWS*S+2*P;cv.style.aspectRatio=cv.width+'/'+cv.height;cv.style.width='min(100%,calc((100vh - 170px)*'+(cv.width/cv.height).toFixed(3)+'))';
 cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({r,c,R:1,B:1,s:0,tint:rnd(3)});
 const at=(r,c)=>r<0||c<0||r>=ROWS||c>=COLS?null:cells[r*COLS+c],st=[cells[rnd(cells.length)]];st[0].s=1;
 while(st.length){const u=st[st.length-1],nb=D.map(([a,b])=>at(u.r+a,u.c+b)).filter(n=>n&&!n.s);if(!nb.length){st.pop();continue}
  const n=nb[rnd(nb.length)];if(n.r>u.r)u.B=0;else if(n.r<u.r)n.B=0;else if(n.c>u.c)u.R=0;else n.R=0;n.s=1;st.push(n)}
 const nk=Math.round(COLS*ROWS*(.1+Math.random()*.16));for(let i=0;i<nk;i++){const x=cells[rnd(cells.length)];if(Math.random()<.5)x.R=0;else x.B=0}
 let ns=0;const mx=COLS*ROWS>=48?2:1;
 for(const k of cells)if(ns<mx&&k.r>0&&k.c>0&&k.r<ROWS-1&&k.c<COLS-1&&Math.random()<.15&&D.filter(([a,b])=>opn(k.r,k.c,a,b)).length===1){k.solid=1;ns++;k.R=1;k.B=1;cells[k.r*COLS+k.c-1].R=1;cells[(k.r-1)*COLS+k.c].B=1}
 walls=[{x:-T/2,y:-T/2,w:COLS*S+T,h:T},{x:-T/2,y:ROWS*S-T/2,w:COLS*S+T,h:T},{x:-T/2,y:-T/2,w:T,h:ROWS*S+T},{x:COLS*S-T/2,y:-T/2,w:T,h:ROWS*S+T}];
 for(const k of cells){if(k.R&&k.c<COLS-1)walls.push({x:(k.c+1)*S-T/2,y:k.r*S-T/2,w:T,h:S+T});if(k.B&&k.r<ROWS-1)walls.push({x:k.c*S-T/2,y:(k.r+1)*S-T/2,w:S+T,h:T})}
 grid=cells.map(k=>walls.filter(w=>w.x<(k.c+1)*S+30&&w.x+w.w>k.c*S-30&&w.y<(k.r+1)*S+30&&w.y+w.h>k.r*S-30));layer=null;mkWorld()}
function path(a,b){const k=(r,c)=>r*COLS+c,prev={},q=[a];prev[k(a.r,a.c)]=-1;
 for(let i=0;i<q.length;i++){const u=q[i];for(const[dr,dc]of D)if(opn(u.r,u.c,dr,dc)){const n={r:u.r+dr,c:u.c+dc};if(prev[k(n.r,n.c)]===undefined){prev[k(n.r,n.c)]=k(u.r,u.c);q.push(n)}}}
 let cur=k(b.r,b.c);const A=k(a.r,a.c);if(cur==A||prev[cur]===undefined)return a;while(prev[cur]!==A)cur=prev[cur];return{r:cur/COLS|0,c:cur%COLS}}

// ---------- collision (shared by game + AI prediction). Handles centre-inside-wall so nothing tunnels ----------
function bounce(b,r){const L=grid[clamp(b.y/S|0,0,ROWS-1)*COLS+clamp(b.x/S|0,0,COLS-1)]||walls;
 for(const w of L){if(Math.abs(b.x-w.x-w.w/2)>w.w/2+r+6||Math.abs(b.y-w.y-w.h/2)>w.h/2+r+6)continue;
  const cx=clamp(b.x,w.x,w.x+w.w),cy=clamp(b.y,w.y,w.y+w.h),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);let nx,ny;
  if(d===0){const l=b.x-w.x,rr=w.x+w.w-b.x,tp=b.y-w.y,bt=w.y+w.h-b.y,m=Math.min(l,rr,tp,bt);nx=ny=0;
   if(m===l){nx=-1;b.x=w.x-r-.1}else if(m===rr){nx=1;b.x=w.x+w.w+r+.1}else if(m===tp){ny=-1;b.y=w.y-r-.1}else{ny=1;b.y=w.y+w.h+r+.1}}
  else if(d<r){nx=dx/d;ny=dy/d;b.x=cx+nx*(r+.1);b.y=cy+ny*(r+.1)}else continue;
  if(b.vx!==undefined){const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}}}}
function free(x,y,r=21){const o={x,y};bounce(o,r);return Math.hypot(o.x-x,o.y-y)<.5}

// ---------- Box2D (planck.js); falls back to basic physics if unavailable ----------
function mkWorld(){if(!BX)return;world=new planck.World({gravity:V(0,0)});
 for(const w of walls){const b=world.createBody({type:'static',position:V((w.x+w.w/2)/PPM,(w.y+w.h/2)/PPM)});b.createFixture(new planck.Box(w.w/2/PPM,w.h/2/PPM),{friction:0,restitution:0,filterCategoryBits:1,filterMaskBits:0xFFFF})}}
function tankBody(t){if(!BX||!world)return null;const b=world.createBody({type:'dynamic',position:V(t.x/PPM,t.y/PPM),angle:t.a,fixedRotation:true}),fd={density:1,friction:0,restitution:0,filterCategoryBits:2,filterMaskBits:3};
 b.createFixture(new planck.Box(18/PPM,14.5/PPM),fd);b.createFixture(new planck.Box(5/PPM,4.5/PPM,V(23/PPM,0),0),fd);return b}
function mkBullet(b){b.body=world.createBody({type:'dynamic',bullet:true,position:V(b.x/PPM,b.y/PPM)});b.body.setLinearVelocity(V(b.vx*60/PPM,b.vy*60/PPM));
 b.body.createFixture(new planck.Circle(4/PPM),{density:1,friction:0,restitution:1,filterCategoryBits:4,filterMaskBits:1})}
function stepWorld(){if(!BX||!world)return;world.step(1/60,8,3);for(const t of tanks)if(t.body){const p=t.body.getPosition();t.x=p.x*PPM;t.y=p.y*PPM;t.body.setLinearVelocity(V(0,0))}}
function move(t,turn,f){t.a+=turn*.075;const v=f>0?SPD:f<0?-SPD*.74:0;
 if(BX&&t.body){t.body.setAngle(t.a);t.body.setLinearVelocity(V(Math.cos(t.a)*v*60/PPM,Math.sin(t.a)*v*60/PPM))}
 else{t.x+=Math.cos(t.a)*v;t.y+=Math.sin(t.a)*v;bounce(t,15);const X=t.x+Math.cos(t.a)*25,Y=t.y+Math.sin(t.a)*25,o={x:X,y:Y};bounce(o,5);t.x+=o.x-X;t.y+=o.y-Y}}
function shoot(t){if(!t.alive||t.cool>0||bullets.filter(b=>b.o===t).length>=t.k.cap)return;t.cool=t.team===0?10:36*dq.fm;sShot(t.k.id==='you'?1:.45);
 const b={x:t.x+Math.cos(t.a)*24,y:t.y+Math.sin(t.a)*24,vx:Math.cos(t.a)*BS,vy:Math.sin(t.a)*BS,life:480,age:0,o:t};b.px=b.x;b.py=b.y;bullets.push(b);if(BX&&world)mkBullet(b)}

// ---------- AI ----------
function target(t){let b=null,bd=1e9;for(const e of tanks)if(e.alive&&e.team!==t.team){const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<bd){bd=d;b=e}}return b}
function ppath(p){if(p.ppT===timer)return p.pp;p.ppT=timer;const q=[];let x=p.x,y=p.y,a=p.a;const dw=p.dw||0,v=p.vs||0,sp=Math.abs(v)<.3?0:v;
 for(let f=0;f<=90;f++){if(f%3===0)q.push([x,y]);a+=dw*Math.max(0,1-f/40);const nx=x+Math.cos(a)*sp,ny=y+Math.sin(a)*sp;if(free(nx,ny,17)){x=nx;y=ny}}p.pp=q;return q}
function ray(t,a,p,N=112){const b={x:t.x+Math.cos(a)*24,y:t.y+Math.sin(a)*24,vx:Math.cos(a)*4,vy:Math.sin(a)*4},q=dq.lead>0?ppath(p):null;let m=999,hi=-1,rb=0;RB=0;
 for(let i=0;i<N;i++){const ox=b.vx,oy=b.vy;b.x+=b.vx;b.y+=b.vy;bounce(b,4);if(b.vx!==ox||b.vy!==oy)RB++;
  if(i>3&&Math.hypot(b.x-t.x,b.y-t.y)<34){if(hi>=0&&i>=45)break;return 999}
  let tx=p.x,ty=p.y;if(q){const e=q[Math.min(q.length-1,Math.round((i+1)*4/BS/3*dq.lead))];tx=e[0];ty=e[1]}
  const d=Math.hypot(b.x-tx,b.y-ty);if(d<m)m=d;if(d<13&&hi<0){hi=i;rb=RB}}
 if(hi>=0){RL=hi+1;RB=rb;return rb<=1?0:500}return m}
function okShot(t,a,p){if(ray(t,a,p)!==0)return false;return RB===0||(RL<=45&&Math.abs(p.dw||0)<.03)}
function muzzleClear(t){const X=t.x+Math.cos(t.a)*24,Y=t.y+Math.sin(t.a)*24,o={x:X,y:Y};bounce(o,7);return Math.hypot(o.x-X,o.y-Y)<.5}
function canFire(t,p){return p&&p.alive&&Math.hypot(p.x-t.x,p.y-t.y)<CLOSE&&muzzleClear(t)&&okShot(t,t.a,p)}
function solve(t,p){const c=[],t0=performance.now();for(let i=0;i<60&&performance.now()-t0<4;i++){const a=i/60*6.2832;c.push({a,d:ray(t,a,p)})}const dir=Math.atan2(p.y-t.y,p.x-t.x);c.push({a:dir,d:ray(t,dir,p)});c.sort((x,y)=>x.d-y.d);
 let best=null,bd=9;for(const q of c.slice(0,4)){if(q.d>70||performance.now()-t0>7)break;for(let k=-6;k<=6;k++){const a=q.a+k*.018;if(okShot(t,a,p)){const d=Math.abs(angd(a,t.a));if(d<bd){bd=d;best=a}}}}return best}
function fut(b){const o={x:b.x,y:b.y,vx:b.vx,vy:b.vy},a=[];for(let f=0;f<=60;f++){a.push([o.x,o.y]);for(let s=0;s<2;s++){o.x+=o.vx;o.y+=o.vy;bounce(o,4)}}return a}
function dodge(t,H){if(FT!==timer){FT=timer;FF=bullets.map(b=>({o:b.o,age:b.age,a:fut(b)}));
  for(const e of tanks)if(e.alive&&e.cool<=3&&bullets.filter(b=>b.o===e).length<e.k.cap)FF.push({o:e,age:99,a:fut({x:e.x+Math.cos(e.a)*24,y:e.y+Math.sin(e.a)*24,vx:Math.cos(e.a)*BS,vy:Math.sin(e.a)*BS})})}
 const F=FF.filter(x=>x.o.team!==t.team).map(x=>x.a);if(!F.length)return null;
 const hit=(x,y,i)=>{for(const a of F){const dx=a[i][0]-x,dy=a[i][1]-y;if(dx*dx+dy*dy<784)return true}return false};let now=false;
 for(let i=0;i<=H&&!now;i++)if(hit(t.x,t.y,i))now=true;for(let i=1;i<=12&&!now;i++)if(hit(t.x+t.mx*2*i,t.y+t.my*2*i,i))now=true;if(!now){t.dg=null;return null}
 const p=target(t)||t,dn=Math.hypot(p.x-t.x,p.y-t.y);let best=null,bs=-1e9;{let ok=0;for(let i=1;i<=33;i++){if(hit(t.x,t.y,i))break;ok=i}bs=ok*10+6;best=ok>=33?{a:t.a,back:0,stop:1}:null}
 for(let j=0;j<16;j++){const a=j/16*6.2832;for(const back of[0,1]){
  const hd=back?a+Math.PI:a,td=Math.abs(angd(hd,t.a))/.075,sp=back?SPD*.74:SPD;let ok=0,x=t.x,y=t.y;
  for(let i=1;i<=33;i++){const mv=Math.max(0,i*2-td)*sp;x=t.x+Math.cos(a)*mv;y=t.y+Math.sin(a)*mv;if((mv>1&&!free(x,y,17))||hit(x,y,i))break;ok=i}
  const c=cellOf({x,y}),dead=D.filter(([u,v])=>opn(c.r,c.c,u,v)).length===1;
  const sc=ok*10-td*.35+(dead?-40:0)+(dn-Math.hypot(p.x-x,p.y-y))*.04+(t.dg&&t.dg.back===back&&Math.abs(angd(a,t.dg.a))<.2?12:0);if(sc>bs){bs=sc;best={a,back}}}}
 t.dg=best;return best}
function exec(t,c){if(c.stop)return move(t,0,0);if(!c.back)return drive(t,c.a,1,1);const d=angd(c.a+Math.PI,t.a);move(t,clamp(d/.075,-1,1),Math.abs(d)<.6?-1:0)}
function drive(t,w,go,exact){const d=angd(w+(exact?0:t.wob),t.a);move(t,clamp(d/.075,-1,1),go&&Math.abs(d)<1.1?1:0)}
const wd=(t,da)=>{const a=t.a+da;for(let i=1;i<=14;i++)if(!free(t.x+Math.cos(a)*i*9,t.y+Math.sin(a)*i*9))return i/14;return 1};
const hk=()=>COLS+'x'+ROWS;
function hot(){let b=0,bi=-1;(HEAT[hk()]||[]).forEach((v,i)=>{if(v>b&&!(cells[i]&&cells[i].solid)){b=v;bi=i}});return bi<0?{r:ROWS>>1,c:COLS>>1}:{r:bi/COLS|0,c:bi%COLS}}
function nearBullet(t){let b=null,bd=200;for(const x of bullets)if(x.o.team!==t.team){const d=Math.hypot(x.x-t.x,x.y-t.y);if(d<bd){bd=d;b=x}}return b}
function feat(t,p){const th=nearBullet(t),ta=angd(Math.atan2(p.y-t.y,p.x-t.x),t.a);return[Math.hypot(p.x-t.x,p.y-t.y)/400,Math.sin(ta),Math.cos(ta),th?1:0,th?angd(Math.atan2(th.vy,th.vx),t.a)/3:0,wd(t,0),wd(t,.9),wd(t,-.9)]}
function knn(t,p){const f=feat(t,p);let B=[];for(const m of MEM){let d=0;for(let i=0;i<8;i++){const x=m.f[i]-f[i];d+=x*x}if(B.length<6||d<B[B.length-1].d){B.push({d,m});B.sort((a,b)=>a.d-b.d);if(B.length>6)B.pop()}}
 return[B.reduce((a,x)=>a+x.m.a[0],0)/B.length,B.reduce((a,x)=>a+x.m.a[1],0)/B.length]}
function ai(t){const k=t.k,p=target(t);t.n++;
 if(t.pause>0){t.pause--;return}
 t.wob=clamp(t.wob*.97+(Math.random()-.5)*dq.wob,-.12,.12);
 if((t.n+t.off)%3===0)t.dgc=dodge(t,k.echo?18:33);
 t.alarm=t.dgc?t.alarm+1:0;
 if(t.dgc&&t.alarm>k.react*dq.rm){exec(t,t.dgc);if(canFire(t,p))shoot(t);return}
 if(!p)return;const dist=Math.hypot(p.x-t.x,p.y-t.y);
 if(dist<CLOSE*1.15){if(t.n-(t.ls||0)>=dq.every&&SB-->0){t.ls=t.n;t.solve=solve(t,p)}}else t.solve=null;
 if(t.solve!=null){drive(t,t.solve,dist>170,1);if(Math.abs(angd(t.solve,t.a))<.05&&canFire(t,p))shoot(t);return}
 if(k.echo&&MEM.length>40){if(t.n%4===0)t.act=knn(t,p);const[a,f]=t.act||[0,0];move(t,clamp(a,-1,1),f>.4?1:f<-.4?-1:0);return}
 if(t.rev>0){t.rev--;move(t,t.revd,-1);return}
 const me=cellOf(t),pc=cellOf(p);let goal=pc;if(k.id==='ash'&&t.n<150)goal=hot();
 const nx=path(me,goal),same=nx.r===me.r&&nx.c===me.c;
 const w=same?Math.atan2(p.y-t.y,p.x-t.x):Math.atan2(nx.r*S+S/2-t.y,nx.c*S+S/2-t.x);let go=1;
 if(wd(t,0)<.3&&Math.abs(angd(w,t.a))>.3)go=0;
 if(t.n%30===0){if(go&&Math.hypot(t.x-(t.sx||0),t.y-(t.sy||0))<5){t.rev=18;t.revd=Math.random()<.5?1:-1}t.sx=t.x;t.sy=t.y}
 if(Math.random()<.002)t.pause=8+rnd(8);
 drive(t,w,go)}

// ---------- round flow ----------
function say(txt,cls){ov.className='';void ov.offsetWidth;ov.textContent=txt;ov.className=(cls?cls+' ':'')+'show'}
const hush=()=>{ov.className=''};
function updKW(){for(const t of tanks){const s=ST[t.k.id];t.chip.lastChild.textContent=s.k+'-'+s.w}$('sy').textContent=ST.you.w;$('sa').textContent=ACTIVE.reduce((a,k)=>a+ST[k.id].w,0)}
function spawnCells(n){const pool=cells.filter(k=>!k.solid),out=[],md=Math.max(2,Math.min(4,(COLS+ROWS)/5|0));let g=0;
 while(out.length<n&&g++<800){const k=pool[rnd(pool.length)];if(!out.includes(k)&&out.every(o=>Math.abs(o.r-k.r)+Math.abs(o.c-k.c)>=md))out.push(k)}
 while(out.length<n){const k=pool[rnd(pool.length)];if(!out.includes(k))out.push(k)}return out}
function newRound(){round++;FT=-1;FF=[];PT=[];EX=[];bullets=[];makeMaze();elim=false;scoring=true;
 const list=[ME,...ACTIVE],cs=spawnCells(list.length);
 tanks=list.map((k,i)=>{const c=cs[i],x=c.c*S+S/2+(Math.random()-.5)*20,y=c.r*S+S/2+(Math.random()-.5)*20,a=Math.random()*6.2832;ST[k.id]=ST[k.id]||{k:0,w:0};
  return{x,y,a,px:x,py:y,pa:a,k,team:i===0?0:(FFA?i:1),alive:1,cool:0,n:0,off:i%3,alarm:0,solve:null,wob:0,mx:0,my:0,dw:0,vs:0,pause:0}});
 tanks.forEach(t=>t.body=tankBody(t));
 ro.innerHTML=tanks.map(t=>`<div class="chip"><i style="--c:${t.k.color}"></i><b>${t.k.name}</b> <small>${t.k.role}</small><span class="kw">0-0</span></div>`).join('');
 tanks.forEach((t,i)=>t.chip=ro.children[i]);updKW();
 $('rd').textContent=CAMP?'Camp · '+MEM.length+' moves':'Round '+round;$('sc').style.display=FFA?'none':'';state='count';timer=0;hush()}
function kill(t,b){t.alive=0;t.chip.classList.add('dead');sBoom();burst(t.x,t.y,t.k.color);
 if(scoring&&b.o!==t){ST[b.o.k.id].k++;updKW()}
 if(t===tanks[0]&&!elim){elim=true;say('Eliminated','top');[330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.2,0,i*.12))}}
function checkEnd(){const p=tanks[0],alive=tanks.filter(t=>t.alive);const over=FFA?alive.length<=1:(!p.alive||!tanks.some(t=>t.team&&t.alive));if(!over)return;
 scoring=false;let win=[];if(FFA){if(alive.length===1)win=alive}else win=p.alive?[p]:alive;win.forEach(t=>ST[t.k.id].w++);updKW();saveMem();
 if(win.includes(p)&&p.alive)[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.18,0,i*.09));state='ending';timer=0}
function update(){
 for(const t of tanks){t.px=t.x;t.py=t.y;t.pa=t.a}for(const b of bullets){b.px=b.x;b.py=b.y}
 if(state==='menu')return;
 if(state==='freeze'){if(++timer>30)newRound();return}
 timer++;
 if(state==='count'){if(timer%30===1&&timer<90){const i=timer/30|0;say(['READY','AIM','FIGHT!'][i],'r'+i);sBeat(i)}if(timer>=90){state='play';timer=0}return}
 if(state==='play'&&timer===30&&ov.textContent==='FIGHT!')hush();
 SB=1;const p=tanks[0],K=keys;
 for(const t of tanks){t.mx=t.x-(t.lx??t.x);t.my=t.y-(t.ly??t.y);t.lx=t.x;t.ly=t.y;t.dw=(t.dw||0)*.6+(t.a-(t.la??t.a))*.4;t.la=t.a;t.vs=t.mx*Math.cos(t.a)+t.my*Math.sin(t.a);if(t.cool>0)t.cool--}
 if(p.alive){const W=CTRL==='wasd',tn=((W?K.d:K.arrowright)?1:0)-((W?K.a:K.arrowleft)?1:0),fw=((W?K.w:K.arrowup)?1:0)-((W?K.s:K.arrowdown)?1:0);move(p,tn,fw);
  if(state==='play'&&!TEST){if(timer%4===0){const e=target(p);if(e){MEM.push({f:feat(p,e).map(v=>+v.toFixed(2)),a:[tn,fw,K[W?'q':' ']?1:0]});if(MEM.length>3200)MEM.splice(0,200)}}
   if(timer%10===0){const c=cellOf(p),h=HEAT[hk()]=HEAT[hk()]||[];h[c.r*COLS+c.c]=(h[c.r*COLS+c.c]||0)+1}}}
 for(let i=1;i<tanks.length;i++)if(tanks[i].alive)ai(tanks[i]);
 stepWorld();
 for(const b of bullets){const ovx=b.vx,ovy=b.vy;
  if(BX&&b.body){const q=b.body.getPosition(),v=b.body.getLinearVelocity(),m=Math.hypot(v.x,v.y)||1;b.body.setLinearVelocity(V(v.x/m*BS*60/PPM,v.y/m*BS*60/PPM));b.x=q.x*PPM;b.y=q.y*PPM;b.vx=v.x/m*BS;b.vy=v.y/m*BS}
  else{b.x+=b.vx;b.y+=b.vy;bounce(b,4)}
  if(Math.abs(b.vx-ovx)+Math.abs(b.vy-ovy)>.6){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<450)sPing(1-d/450)}
  b.life--;b.age++;
  for(const t of tanks)if(t.alive&&Math.hypot(b.x-t.x,b.y-t.y)<17&&(t.team!==b.o.team||(t===b.o&&b.age>8&&t.team===0))){kill(t,b);b.life=0;break}}
 bullets=bullets.filter(b=>{if(b.life>0)return true;if(b.body&&world)world.destroyBody(b.body);return false});
 for(const t of tanks)if(!t.alive&&t.body&&world){world.destroyBody(t.body);t.body=null}
 if(state==='play')checkEnd();else if(state==='ending'&&timer>105){state='freeze';timer=0}}

// ---------- drawing (interpolated for smooth motion at any refresh rate) ----------
const shade=(h,f)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*f).toString(16).padStart(2,'0')).join('');
function paintMaze(c){c.fillStyle='#1b1b1b';c.fillRect(0,0,cv.width,cv.height);c.save();c.translate(P,P);
 cells.forEach(k=>{c.fillStyle=k.solid?'#141414':['#ececec','#e2e2e2','#d6d6d6'][k.tint];c.fillRect(k.c*S,k.r*S,S,S)});c.fillStyle='#6b6b6b';walls.forEach(w=>c.fillRect(w.x,w.y,w.w,w.h));c.restore()}
function drawTank(t){if(!t.alive)return;const x=t.px+(t.x-t.px)*IA,y=t.py+(t.y-t.py)*IA,a=t.pa+(t.a-t.pa)*IA,c=t.k.color;
 ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.lineJoin='miter';ctx.lineWidth=2;ctx.strokeStyle='#000';
 ctx.fillStyle=shade(c,.26);ctx.fillRect(-18.5,-14.5,37,29);ctx.strokeRect(-18.5,-14.5,37,29);
 for(const yy of[-13.5,9]){ctx.fillStyle=shade(c,.6);ctx.fillRect(-17.5,yy,35,4.5);ctx.fillStyle='#fff';for(let xx=-16;xx<17;xx+=5)ctx.fillRect(xx,yy+(yy<0?0:3.6),1,.9)}
 ctx.fillStyle=c;ctx.fillRect(0,-4,26,8);ctx.strokeRect(0,-4,26,8);
 const g=ctx.createRadialGradient(-1,-1,2,0,0,10);g.addColorStop(0,c);g.addColorStop(1,shade(c,.78));ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fillStyle=g;ctx.fill();ctx.stroke();ctx.restore()}
function draw(){if(!layer){layer=document.createElement('canvas');layer.width=cv.width;layer.height=cv.height;paintMaze(layer.getContext('2d'))}
 ctx.drawImage(layer,0,0);ctx.save();ctx.translate(P,P);for(const t of tanks)drawTank(t);
 ctx.fillStyle='#000';for(const b of bullets){ctx.beginPath();ctx.arc(b.px+(b.x-b.px)*IA,b.py+(b.y-b.py)*IA,4,0,7);ctx.fill()}ctx.restore()}
function burst(x,y,c){SHK=9;EX.push({x,y,l:0});
 for(let i=0;i<24;i++){const a=Math.random()*6.28,v=1+Math.random()*5;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:28+rnd(30),c:['#ffd54a','#ff9a2e','#ff5a1f'][i%3],r:2+Math.random()*2.5})}
 for(let i=0;i<12;i++){const a=Math.random()*6.28,v=1+Math.random()*3.5;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:40+rnd(25),c:i%2?c:'#1d1d20',r:2.5+Math.random()*3,sq:1})}}
function drawParts(n){ctx.save();ctx.translate(P,P);EX=EX.filter(e=>e.l<26);
 for(const e of EX){e.l+=n;const k=Math.min(1,e.l/26),r=14+k*60,g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r);
  g.addColorStop(0,'rgba(255,245,200,'+.95*(1-k)+')');g.addColorStop(.5,'rgba(255,150,40,'+.7*(1-k)+')');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,r,0,7);ctx.fill()}
 PT=PT.filter(p=>p.l>0);for(const p of PT){for(let i=0;i<n;i++){p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.l--}ctx.globalAlpha=clamp(p.l/20,0,1);ctx.fillStyle=p.c;
  if(p.sq)ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}}ctx.restore()}

// ---------- input, menu, camp ----------
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 try{au().resume()}catch(x){}

 if(k===(CTRL==='wasd'?'q':' ')&&!keys[k]&&(state==='play'||state==='ending')&&tanks[0]&&tanks[0].alive)shoot(tanks[0]);keys[k]=1;
 if(k==='m')mute^=1;if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
addEventListener('beforeunload',saveMem);setInterval(saveMem,5000);
const menu=document.createElement('div');menu.className='glass';menu.style.cssText='position:absolute;inset:0;margin:auto;width:min(94%,620px);height:fit-content;padding:26px;border-radius:34px;text-align:center;z-index:5';
const card=(on,html,at)=>'<button '+at+' style="cursor:pointer;color:#fff;font:inherit;padding:18px 10px;border-radius:24px;border:1.5px solid rgba(255,255,255,'+(on?'.9':'.3')+');background:rgba(255,255,255,'+(on?'.26':'.1')+');transition:.2s">'+html+'</button>';
function drawMenu(){menu.innerHTML='<h2 style="margin:0 0 6px;font-size:26px">Get ready</h2><p style="margin:0 0 16px;font-size:13px;opacity:.75">Pick your controls. Press Enter to start.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
 card(CTRL==='wasd','<b style="font-size:22px;letter-spacing:2px">W A S D</b><br><span style="font-size:13px;opacity:.8">Fire: Q</span>','data-c="wasd"')+card(CTRL==='arrows','<b style="font-size:22px;letter-spacing:2px">↑ ← ↓ →</b><br><span style="font-size:13px;opacity:.8">Fire: Space</span>','data-c="arrows"')+'</div>'+
 (CAMP?'':'<div style="margin-top:12px">'+card(FFA,'<b>AIs fight each other too: '+(FFA?'ON':'OFF')+'</b><br><span style="font-size:12px;opacity:.75">'+(FFA?'Free-for-all, everyone against everyone':'The AIs team up against you')+'</span>','data-f="1" style2')+'</div>')+
 '<button data-go="1" style="margin-top:16px;width:100%;cursor:pointer;border:0;color:#fff;font:inherit;font-size:20px;font-weight:800;letter-spacing:2px;padding:16px;border-radius:999px;background:linear-gradient(180deg,#5b8cff,#3b4fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 10px 30px rgba(60,90,255,.6)">START</button>'}
menu.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){CTRL=b.dataset.c;tone(600,.08,'triangle',.12);drawMenu()}else if(b.dataset.f){FFA=!FFA;tone(FFA?700:450,.1,'triangle',.12);drawMenu()}else if(b.dataset.go)startGame()};
function startGame(){if(state!=='menu')return;if(CAMP)FFA=false;try{localStorage.raytanks_ctrl=CTRL;localStorage.raytanks_ffa=FFA?'1':'0'}catch(e){}menu.remove();
 hint.textContent=(CTRL==='wasd'?'Move: WASD · Fire: Q':'Move: Arrow keys · Fire: Space')+' · Mute: M · Fullscreen: F'+(BX?' · Physics: Box2D':' · Physics: basic');tone(660,.14,'triangle',.18,200);newRound()}
drawMenu();document.querySelector('.stage').appendChild(menu);
$('an').textContent=ACTIVE.map(k=>k.name).join(' · ');
if(CAMP){const bar=document.createElement('div');bar.className='glass roster';
 bar.innerHTML='<b>Learning Camp</b><span id="cm" style="font-size:13px;opacity:.85"></span><div style="flex:1;min-width:120px;height:8px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden"><i id="cb" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#5b8cff,#ff7ad9);transition:width .4s"></i></div><a class="btn glass" href="?camp=1&ai=rex,ash&d=0">Train</a><a class="btn glass" href="?camp=1&ai=echo&d=2&test=1">Test Echo</a><a class="btn glass" href="#" id="rs">Reset</a>';
 document.querySelector('main').insertBefore(bar,document.querySelector('.stage'));$('rs').onclick=e=>{e.preventDefault();MEM=[];HEAT={};saveMem()};
 setInterval(()=>{$('cm').textContent=(TEST?'Testing Echo (not recording)':'Training: Echo is watching you')+' · '+MEM.length+' moves';$('cb').style.width=Math.min(100,MEM.length/30)+'%'},400)}

// ---------- main loop: fixed 60Hz simulation + interpolated rendering ----------
makeMaze();
let lastT=0,acc=0;
(function loop(now){let n=0;try{acc+=Math.min(100,lastT?now-lastT:16.7);lastT=now;while(acc>=16.667&&n<4){update();acc-=16.667;n++}if(n>=4)acc=0;IA=clamp(acc/16.667,0,1);
  draw();const live=state!=='menu'&&state!=='freeze';drawParts(live?n:0);if(live&&SHK>0)SHK=Math.max(0,SHK-n*.7);
  if(SHK>0||cv._s){cv._s=SHK>0;cv.style.transform=SHK>0?'translate('+(Math.random()-.5)*SHK+'px,'+(Math.random()-.5)*SHK+'px)':''}}
 catch(e){console.error(e);if(BX){BX=false;world=null;tanks.forEach(t=>t.body=null);bullets.forEach(b=>b.body=null);hint.textContent+=' · Box2D error, switched to basic physics'}}
 requestAnimationFrame(loop)})(performance.now());
