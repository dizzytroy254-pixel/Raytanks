<!DOCTYPE html>
<!-- FILE: play.html  |  THE GAME PAGE  |  goes in the ROOT of your repo (next to index.html and vercel.json) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAYTANKS</title>
<style>
:root{--g:rgba(255,255,255,.14);--gb:rgba(255,255,255,.32)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#fff;
background:radial-gradient(60% 50% at 12% 8%,#3b6cff 0,transparent 60%),radial-gradient(50% 45% at 92% 18%,#ff5fa8 0,transparent 60%),radial-gradient(60% 55% at 60% 100%,#17c9a6 0,transparent 60%),#0a0f1f;background-attachment:fixed}
main{max-width:1900px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);
box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:999px}
.btn{color:#fff;text-decoration:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn:hover{background:rgba(255,255,255,.25)}
.score{display:flex;align-items:baseline;gap:10px;font-weight:700}
.score b{font-size:30px;font-variant-numeric:tabular-nums}.score span{font-size:13px;opacity:.8;font-weight:600}.score i{opacity:.4;font-style:normal}
#rd{font-size:14px;font-weight:600;opacity:.9;min-width:80px;text-align:right}
.stage{position:relative;border-radius:34px;padding:10px}
canvas{display:block;width:min(100%,calc((100vh - 175px)*1.53));aspect-ratio:1012/660;height:auto;margin:0 auto;border-radius:26px}
#ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);min-width:150px;padding:22px 38px;border-radius:44px;
text-align:center;font-size:64px;font-weight:800;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;white-space:nowrap}
#ov.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#ov.sm{font-size:30px}
.roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border-radius:26px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:14px;transition:opacity .3s}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.chip small{opacity:.65;font-weight:500}.chip.dead{opacity:.35;text-decoration:line-through}
.hint{margin:0;text-align:center;font-size:13px;opacity:.7}
</style>
<script src="https://cdn.jsdelivr.net/npm/planck@1/dist/planck.min.js"></script>
</head>
<body>
<main>
  <header class="glass bar">
    <a class="btn glass" href="../index.html">‹ Home</a>
    <div class="score"><b id="sy">0</b><span>You</span><i>:</i><span id="an">AI</span><b id="sa">0</b></div>
    <div id="rd">Round 1</div>
  </header>
  <div class="glass stage"><canvas id="c"></canvas><div id="ov" class="glass"></div></div>
  <footer class="glass roster" id="ro"></footer>
  <p class="hint">Move: WASD or arrows &nbsp;·&nbsp; Fire: Q &nbsp;·&nbsp; Fullscreen: F &nbsp;·&nbsp; Bullets bounce and can hit you</p>
</main>
<script>
const COLS=11,ROWS=7,S=88,T=8,P=22,D=[[0,1],[1,0],[0,-1],[-1,0]];
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),ro=document.getElementById('ro');
cv.width=COLS*S+2*P;cv.height=ROWS*S+2*P;
let walls=[],grid=[],cells=[],tanks=[],bullets=[],state='count',timer=0,round=0;const score=[0,0],keys={};
const KINDS=[
 {name:'Rex',role:'Hunter',color:'#ff5a52',chase:1,keep:0,camp:0,react:10,fire:10},
 {name:'Vex',role:'Sniper',color:'#ffc233',chase:.45,keep:240,camp:0,react:5,fire:16},
 {name:'Zip',role:'Phantom',color:'#a67bff',chase:.75,keep:130,camp:0,react:2,fire:12},
 {name:'Ash',role:'Ambusher',color:'#2fd08a',chase:.5,keep:0,camp:1,react:6,fire:8}];
KINDS.push({name:'Echo',role:'Mimic',color:'#ff7ad9',chase:1,keep:0,camp:0,react:4,fire:10,echo:1});
KINDS.forEach((k,i)=>{k.id=['rex','vex','zip','ash','echo'][i];k.cap=[3,2,2,3,3][i]});
const Q=new URLSearchParams(location.search),LV=+(Q.get('d')||2),ids=(Q.get('ai')||'rex,vex,zip,ash').split(',');
const ACTIVE=KINDS.filter(k=>ids.includes(k.id)).length?KINDS.filter(k=>ids.includes(k.id)):KINDS.slice(0,4);
const DIFF=[{every:30,jit:.16,rm:3,fm:2.5,lead:0},{every:16,jit:.07,rm:1.6,fm:1.4,lead:0},{every:8,jit:.02,rm:1,fm:1,lead:.5},{every:3,jit:0,rm:0,fm:.8,lead:1}],dq=DIFF[LV]||DIFF[2];
let BX=!!window.planck;const CLOSE=420,BS=2.325*1.25,PPM=30,V=BX?(x,y)=>new planck.Vec2(x,y):null;let FT=-1,FF=[],world=null,SB=1,layer=null,MEM=[],HEAT=[],AC,mute=0;try{MEM=JSON.parse(localStorage.raytanks_mem||'[]').filter(m=>m.f&&m.f.length===8)}catch(e){}
const saveMem=()=>{try{localStorage.raytanks_mem=JSON.stringify(MEM.slice(-3000));localStorage.raytanks_heat=JSON.stringify(HEAT)}catch(e){}};try{HEAT=JSON.parse(localStorage.raytanks_heat||'[]')}catch(e){}
const au=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function snd(f,d=.1,ty='sine',v=.15,sl=0){if(mute)return;try{const c=au(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start();o.stop(t+d)}catch(e){}}
function boom(){if(mute)return;try{const c=au(),n=c.sampleRate*.45|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)**2;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=650;g.gain.value=.6;s.connect(f).connect(g).connect(c.destination);s.start()}catch(e){}}
function wd(t,da){const a=t.a+da;for(let i=1;i<=14;i++)if(!free(t.x+Math.cos(a)*i*9,t.y+Math.sin(a)*i*9))return i/14;return 1}
function feat(t,p){const th=threat(t),ta=angd(Math.atan2(p.y-t.y,p.x-t.x),t.a);return[Math.hypot(p.x-t.x,p.y-t.y)/400,Math.sin(ta),Math.cos(ta),th?1:0,th?angd(Math.atan2(th.vy,th.vx),t.a)/3:0,wd(t,0),wd(t,.9),wd(t,-.9)]}
function hot(){let b=0,bi=-1;HEAT.forEach((v,i)=>{if(v>b&&!(cells[i]&&cells[i].solid)){b=v;bi=i}});return bi<0?{r:ROWS>>1,c:COLS>>1}:{r:bi/COLS|0,c:bi%COLS}}
function knn(t,p){const f=feat(t,p),n=MEM.map(m=>({d:m.f.reduce((a,v,i)=>a+(v-f[i])**2,0),m})).sort((a,b)=>a.d-b.d).slice(0,6);return[n.reduce((a,x)=>a+x.m.a[0],0)/n.length,n.reduce((a,x)=>a+x.m.a[1],0)/n.length,n.reduce((a,x)=>a+(x.m.a[2]||0),0)/n.length]}
const angd=(a,b)=>((a-b+9.4248)%6.2832)-3.1416;
const cellOf=t=>({r:Math.max(0,Math.min(ROWS-1,t.y/S|0)),c:Math.max(0,Math.min(COLS-1,t.x/S|0))});

function open(r,c,dr,dc){const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)return false;
 if(dc==1)return!cells[r*COLS+c].R;if(dc==-1)return!cells[r*COLS+nc].R;if(dr==1)return!cells[r*COLS+c].B;return!cells[nr*COLS+c].B}
function makeMaze(){cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({r,c,R:1,B:1,s:0,tint:Math.random()*3|0});
 const at=(r,c)=>r<0||c<0||r>=ROWS||c>=COLS?null:cells[r*COLS+c],st=[cells[0]];cells[0].s=1;
 while(st.length){const u=st[st.length-1],nb=D.map(([a,b])=>at(u.r+a,u.c+b)).filter(n=>n&&!n.s);if(!nb.length){st.pop();continue}
  const n=nb[Math.random()*nb.length|0];if(n.r>u.r)u.B=0;else if(n.r<u.r)n.B=0;else if(n.c>u.c)u.R=0;else n.R=0;n.s=1;st.push(n)}
 for(let i=0,n=8+(Math.random()*14|0);i<n;i++){const x=cells[Math.random()*cells.length|0];if(Math.random()<.5)x.R=0;else x.B=0}for(const k of cells){if(k.r>0&&k.c>0&&k.r<ROWS-1&&k.c<COLS-1&&Math.random()<.15&&D.filter(([a,b])=>open(k.r,k.c,a,b)).length===1&&cells.filter(x=>x.solid).length<2){k.solid=1;k.R=1;k.B=1;cells[k.r*COLS+k.c-1].R=1;cells[(k.r-1)*COLS+k.c].B=1}}
 walls=[{x:-T/2,y:-T/2,w:COLS*S+T,h:T},{x:-T/2,y:ROWS*S-T/2,w:COLS*S+T,h:T},{x:-T/2,y:-T/2,w:T,h:ROWS*S+T},{x:COLS*S-T/2,y:-T/2,w:T,h:ROWS*S+T}];
 for(const k of cells){if(k.R&&k.c<COLS-1)walls.push({x:(k.c+1)*S-T/2,y:k.r*S-T/2,w:T,h:S+T});if(k.B&&k.r<ROWS-1)walls.push({x:k.c*S-T/2,y:(k.r+1)*S-T/2,w:S+T,h:T})};grid=cells.map(k=>walls.filter(w=>w.x<(k.c+1)*S+22&&w.x+w.w>k.c*S-22&&w.y<(k.r+1)*S+22&&w.y+w.h>k.r*S-22));layer=null;mkWorld()}

function path(a,b){const k=(r,c)=>r*COLS+c,prev={},q=[a];prev[k(a.r,a.c)]=-1;
 for(let i=0;i<q.length;i++){const u=q[i];for(const[dr,dc]of D)if(open(u.r,u.c,dr,dc)){const n={r:u.r+dr,c:u.c+dc};if(prev[k(n.r,n.c)]===undefined){prev[k(n.r,n.c)]=k(u.r,u.c);q.push(n)}}}
 let cur=k(b.r,b.c);const A=k(a.r,a.c);if(cur==A||prev[cur]===undefined)return a;
 while(prev[cur]!==A)cur=prev[cur];return{r:cur/COLS|0,c:cur%COLS}}

function bounce(b,r){const L=grid[Math.max(0,Math.min(ROWS-1,b.y/S|0))*COLS+Math.max(0,Math.min(COLS-1,b.x/S|0))]||walls;for(const w of L){
 if(Math.abs(b.x-w.x-w.w/2)>w.w/2+r+6||Math.abs(b.y-w.y-w.h/2)>w.h/2+r+6)continue;
 const cx=Math.max(w.x,Math.min(b.x,w.x+w.w)),cy=Math.max(w.y,Math.min(b.y,w.y+w.h)),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);
 if(d<r&&d>0){const nx=dx/d,ny=dy/d,dot=(b.vx||0)*nx+(b.vy||0)*ny;if(b.vx!==undefined&&dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}b.x=cx+nx*(r+.1);b.y=cy+ny*(r+.1)}}}
function free(x,y){const o={x,y};bounce(o,21);return Math.hypot(o.x-x,o.y-y)<.5}

function move(t,turn,f){t.a+=turn*.075;const v=f>0?2.325:f<0?-1.725:0;if(BX&&t.body){t.body.setAngle(t.a);t.body.setLinearVelocity(V(Math.cos(t.a)*v*60/PPM,Math.sin(t.a)*v*60/PPM))}else{t.x+=Math.cos(t.a)*v;t.y+=Math.sin(t.a)*v;bounce(t,15)}}
function shoot(t){if(!t.alive||t.cool>0||bullets.filter(b=>b.o===t).length>=(t.k.cap||5))return;t.cool=t.team?36*dq.fm:10;snd(t.team?300:520,.12,'square',t.team?.03:.08,-250);
 bullets.push({x:t.x+Math.cos(t.a)*30,y:t.y+Math.sin(t.a)*30,vx:Math.cos(t.a)*BS,vy:Math.sin(t.a)*BS,life:480,age:0,o:t});if(BX)mkBullet(bullets[bullets.length-1])}

// ---- AI: simulates bouncing shots to find angles that hit the player ----
let RB=0;
function ray(t,a,p,N=90){const b={x:t.x+Math.cos(a)*30,y:t.y+Math.sin(a)*30,vx:Math.cos(a)*5,vy:Math.sin(a)*5};let m=999;RB=0;
 for(let i=0;i<N;i++){const ox=b.vx,oy=b.vy;b.x+=b.vx;b.y+=b.vy;bounce(b,4);if(b.vx!==ox||b.vy!==oy)RB++;
  const fr=Math.min(60,(i+1)*5/BS)*dq.lead,d=Math.hypot(b.x-p.x-(p.mx||0)*fr,b.y-p.y-(p.my||0)*fr);if(d<m)m=d;
  if(d<13)return RB<=1?0:500;if(i>6&&Math.hypot(b.x-t.x,b.y-t.y)<24)return 999}return m}
function canFire(t,p){return p.alive&&Math.hypot(p.x-t.x,p.y-t.y)<CLOSE&&ray(t,t.a,p)===0}
function solve(t,p){const c=[];for(let i=0;i<72;i++){const a=i/72*6.2832;c.push({a,d:ray(t,a,p)})}
 const dir=Math.atan2(p.y-t.y,p.x-t.x);c.push({a:dir,d:ray(t,dir,p)});c.sort((x,y)=>x.d-y.d);
 let best=null,bd=9;for(const q of c.slice(0,3)){if(q.d>70)break;for(let k=-6;k<=6;k++){const a=q.a+k*.016;if(ray(t,a,p)===0){const d=Math.abs(angd(a,t.a));if(d<bd){bd=d;best=a}}}}return best}
function fut(b){const o={x:b.x,y:b.y,vx:b.vx,vy:b.vy},a=[];for(let f=0;f<=60;f++){a.push([o.x,o.y]);for(let s=0;s<3;s++){o.x+=o.vx;o.y+=o.vy;bounce(o,4)}}return a}
function dodge(t,H){if(FT!==timer){FT=timer;FF=bullets.map(b=>({o:b.o,age:b.age,a:fut(b)}))}
 const F=FF.filter(x=>x.o.team!==t.team||(x.o===t&&x.age>=10)).map(x=>x.a);if(!F.length)return null;
 const hit=(x,y,i)=>F.some(a=>Math.hypot(a[i][0]-x,a[i][1]-y)<27);let now=false;
 for(let i=0;i<=H;i++)if(hit(t.x,t.y,i)){now=true;break}if(!now){t.dg=null;return null}
 let best=null,bs=-1e9;
 for(let j=0;j<24;j++){const a=j/24*6.2832;for(const back of[0,1]){
  const hd=back?a+Math.PI:a,td=Math.abs(angd(hd,t.a))/.075,sp=back?1.725:2.325;let ok=0;
  for(let i=1;i<=22;i++){const mv=Math.max(0,i*3-td)*sp,x=t.x+Math.cos(a)*mv,y=t.y+Math.sin(a)*mv;if(!free(x,y)||hit(x,y,i))break;ok=i}
  const sc=ok*10-td*.35+(t.dg&&t.dg.back===back&&Math.abs(angd(a,t.dg.a))<.2?12:0);if(sc>bs){bs=sc;best={a,back}}}}
 t.dg=best;return best}
function exec(t,c){if(!c.back)return drive(t,c.a,1);const d=angd(c.a+Math.PI,t.a);move(t,Math.max(-1,Math.min(1,d/.075)),Math.abs(d)<.6?-1:0)}
function ddrive(t,w){const d=angd(w,t.a);if(Math.abs(d)>1.9){const d2=angd(w+Math.PI,t.a);move(t,Math.max(-1,Math.min(1,d2/.075)),Math.abs(d2)<.7?-1:0)}else drive(t,w,1)}
function threat(t){for(const b of bullets){if(b.o.team===t.team)continue;for(let f=0;f<90;f+=3)if(Math.hypot(b.x+b.vx*f-t.x,b.y+b.vy*f-t.y)<30)return b}return null}
function drive(t,w,go){const d=angd(w,t.a);move(t,Math.max(-1,Math.min(1,d/.075)),go&&Math.abs(d)<.6?1:0)}
function ai(t){const p=tanks[0],k=t.k;t.n++;
 if(p.alive&&t.n-(t.ls||0)>=dq.every&&SB-->0){t.ls=t.n;t.solve=Math.hypot(p.x-t.x,p.y-t.y)<CLOSE*1.15?solve(t,p):null;t.jit=(Math.random()-.5)*2*dq.jit}if(!p.alive)t.solve=null;
 const dg=dodge(t,k.echo?9:22);t.alarm=dg?t.alarm+1:0;if(dg&&t.alarm>k.react*dq.rm){exec(t,dg);if(canFire(t,p))shoot(t);return}
 if(t.solve!=null){drive(t,t.solve,0);if(Math.abs(angd(t.solve,t.a))<.05&&canFire(t,p))shoot(t);return}
 if(k.echo&&MEM.length>40){if(t.n%4==0)t.act=knn(t,p);const[a,f,fr]=t.act||[0,0,0];move(t,Math.max(-1,Math.min(1,a)),f>.4?1:f<-.4?-1:0);return}if(k.camp&&t.n<700){const me=cellOf(t),h=hot();if(me.r===h.r&&me.c===h.c){t.a+=.025;return}const nx=path(me,h);drive(t,Math.atan2(nx.r*S+S/2-t.y,nx.c*S+S/2-t.x),1);return}
 const me=cellOf(t),pc=cellOf(p);let goal=pc;
 if(k.keep&&Math.hypot(p.x-t.x,p.y-t.y)<k.keep)goal={r:pc.r<ROWS/2?ROWS-1:0,c:pc.c<COLS/2?COLS-1:0};
 const nx=path(me,goal),same=nx.r==me.r&&nx.c==me.c;
 const w=same?Math.atan2(p.y-t.y,p.x-t.x):Math.atan2(nx.r*S+S/2-t.y,nx.c*S+S/2-t.x);
 drive(t,w,1)}

function newRound(){round++;makeMaze();bullets=[];state='count';timer=0;
 const used=new Set(cells.filter(k=>k.solid).map(k=>k.r+','+k.c)),pick=(c0,c1)=>{let r,c;do{r=Math.random()*ROWS|0;c=c0+(Math.random()*(c1-c0)|0)}while(used.has(r+','+c));used.add(r+','+c);return{x:c*S+S/2,y:r*S+S/2}};
 const mk=(pos,k,team)=>({...pos,a:team?Math.PI:0,k,team,alive:1,cool:0,n:0,off:Math.random()*10|0,alarm:0,solve:null});
 tanks=[mk(pick(0,3),{name:'You',role:'Player',color:'#cfcfd6',fire:10},0),...ACTIVE.map(k=>mk(pick(COLS-5,COLS),k,1))];
 tanks.forEach(t=>t.body=tankBody(t));ro.innerHTML=tanks.map(t=>`<div class="chip"><i style="--c:${t.k.color}"></i>${t.k.name} <small>${t.k.role}</small></div>`).join('');
 tanks.forEach((t,i)=>t.chip=ro.children[i]);document.getElementById('rd').textContent=Q.get('camp')?'Camp · '+MEM.length+' moves':'Round '+round;ov.classList.remove('sm');ov.classList.add('show')}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k==='q'&&!keys[k]&&state==='play')shoot(tanks[0]);keys[k]=1});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

function update(){SB=1;timer++;
 if(state==='count'){const n=3-Math.floor(timer/28),s=n>0?''+n:'GO';if(ov.textContent!==s){ov.textContent=s;snd(n>0?440:880,.15,'sine',.2)}if(timer>=112){state='play';ov.classList.remove('show')}return}
 const p=tanks[0],K=keys;if(state==='play'&&p.alive&&timer%10==0&&!Q.get('test')){const pc=cellOf(p),hi=pc.r*COLS+pc.c;HEAT[hi]=(HEAT[hi]||0)+1}
 if(state==='play'&&p.alive){const tn=((K.d||K.arrowright)?1:0)-((K.a||K.arrowleft)?1:0),fw=((K.w||K.arrowup)?1:0)-((K.s||K.arrowdown)?1:0);move(p,tn,fw);
  if(timer%4==0&&!Q.get('test')){const e=tanks.filter(x=>x.team&&x.alive).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(e){MEM.push({f:feat(p,e).map(v=>+v.toFixed(2)),a:[tn,fw,K.q?1:0]});if(MEM.length>3200)MEM.splice(0,200)}}}
