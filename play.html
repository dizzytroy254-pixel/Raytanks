<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Cg transform='rotate%28-28 32 32%29'%3E%3Crect x='13' y='20' width='34' height='24' fill='%23262a31' stroke='%23050506' stroke-width='2'/%3E%3Crect x='14' y='21' width='32' height='5' fill='%23d5d7db'/%3E%3Crect x='14' y='38' width='32' height='5' fill='%23d5d7db'/%3E%3Crect x='30' y='29' width='24' height='6' fill='%2322d3ee' stroke='%23050506' stroke-width='2'/%3E%3Crect x='51' y='28' width='6' height='8' fill='%230e7490' stroke='%23050506' stroke-width='2'/%3E%3Ccircle cx='29' cy='32' r='9.5' fill='%2322d3ee' stroke='%23050506' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E">

<style>
:root{--line:rgba(255,255,255,.1);--txt:#eceef2;--mut:#9aa0ab}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--txt);background:#0d0e11;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,#1d1f26 0,#0d0e11 62%)}
main{padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
button{font:inherit;color:inherit}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 14px;border-radius:22px;background:rgba(34,36,42,.72);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:9px;color:var(--txt);text-decoration:none;font-weight:800;letter-spacing:3px;font-size:15px;transition:opacity .2s}.brand:hover{opacity:.75}.brand svg{width:26px;height:26px}
.roster{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:600;font-size:13px;transition:opacity .3s,background .2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}.chip .kw{padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.35);font-weight:800;font-variant-numeric:tabular-nums}
.chip.dead{opacity:.38}.chip.dead b{text-decoration:line-through}
.tools{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:600}
.ib{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;font-size:16px;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s}.ib:hover{background:rgba(255,255,255,.14);transform:scale(1.06)}.ib:active{transform:scale(.92)}
.stage{position:relative;border-radius:22px;padding:6px;background:#050506;border:1px solid #2b2d34;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.03)}
canvas{display:block;height:auto;border-radius:16px;will-change:transform}
#ov{--a:#fff;--b:#b9bec9;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-style:italic;letter-spacing:8px;text-align:center;pointer-events:none;opacity:0;white-space:nowrap;font-size:clamp(46px,10vw,130px);line-height:1.1;background:linear-gradient(180deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 26px rgba(0,0,0,.6))}
#ov:before,#ov:after{content:"";position:absolute;top:52%;height:3px;width:0;background:linear-gradient(90deg,transparent,#fff);opacity:.8}
#ov:before{right:calc(100% + 18px)}#ov:after{left:calc(100% + 18px);transform:scaleX(-1)}
#ov.show{opacity:1;animation:slam .38s cubic-bezier(.16,1.2,.3,1)}#ov.show:before,#ov.show:after{animation:lines .5s ease-out forwards}
#ov.r2{--b:#ffb066}
@keyframes slam{from{transform:translate(-50%,-50%) scale(2.4);opacity:0;letter-spacing:34px}to{transform:translate(-50%,-50%) scale(1);opacity:1;letter-spacing:8px}}
@keyframes lines{from{width:0}to{width:min(18vw,200px)}}
#fl{position:absolute;inset:6px;border-radius:16px;background:#fff;opacity:0;pointer-events:none}#fl.go{animation:fl .5s ease-out}
@keyframes fl{from{opacity:.6}to{opacity:0}}
.scrim{position:absolute;inset:0;border-radius:22px;background:rgba(5,6,8,.78);display:grid;place-items:center;z-index:5}
.panel{width:min(92%,580px);padding:26px;border-radius:28px;background:#17181d;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);text-align:center;animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 4px;font-size:26px;letter-spacing:.5px}.panel p{margin:0 0 18px;font-size:13px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{cursor:pointer;padding:18px 10px;border-radius:22px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.opt:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}.opt:active{transform:scale(.97)}.opt.on{border-color:#fff;background:rgba(255,255,255,.14)}
.opt b{font-size:21px;letter-spacing:2px}.opt span{display:block;margin-top:4px;font-size:13px;color:var(--mut)}

.go:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 16px 40px rgba(255,255,255,.2)}.go:active{transform:scale(.97)}
.camp{width:100%}
a.pill{color:var(--txt);text-decoration:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:600;font-size:13px}a.pill:hover{background:rgba(255,255,255,.18)}

<body>
<main>
  <header class="bar">
    <a class="brand" href="../index.html" title="Home"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#15161a"/><g transform="rotate(-28 32 32)"><rect x="13" y="20" width="34" height="24" fill="#262a31" stroke="#050506" stroke-width="2"/><rect x="14" y="21" width="32" height="5" fill="#d5d7db"/><rect x="14" y="38" width="32" height="5" fill="#d5d7db"/><rect x="30" y="29" width="24" height="6" fill="#22d3ee" stroke="#050506" stroke-width="2"/><circle cx="29" cy="32" r="9.5" fill="#22d3ee" stroke="#050506" stroke-width="2"/></g></svg>RAYTANKS</a>
    <div class="roster" id="ro"></div>
    <div class="tools"><span id="rd">Round 1</span><button class="ib" id="fs" title="Fullscreen (F)">⛶</button><button class="ib" id="mu" title="Sound (M)">♪</button></div>
  </header>
  <div class="stage"><canvas id="c"></canvas><div id="ov"></div><div id="fl"></div></div>
</main>
<script>
const S=88,T=8,P=22,D=[[0,1],[1,0],[0,-1],[-1,0]],PPM=30,SPD=2.5,BS=SPD*1.25,CLOSE=440;
let COLS=11,ROWS=7;
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d',{alpha:false,desynchronized:true}),ov=$('ov'),ro=$('ro'),fl=$('fl');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),angd=(a,b)=>((a-b+9.4248)%6.2832)-3.1416,rnd=n=>Math.random()*n|0;
const Q=new URLSearchParams(location.search),LV=+(Q.get('d')||2),CAMP=!!Q.get('camp'),TEST=!!Q.get('test');
const KINDS=[{id:'rex',name:'Rex',role:'Hunter',color:'#ff5a52',cap:4,react:3},{id:'vex',name:'Vex',role:'Sniper',color:'#ffc233',cap:3,react:2},
 {id:'zip',name:'Zip',role:'Phantom',color:'#a67bff',cap:3,react:0},{id:'ash',name:'Ash',role:'Ambusher',color:'#2fd08a',cap:4,react:2},
 {id:'echo',name:'Echo',role:'Mimic',color:'#ff7ad9',cap:4,react:1,echo:1}];
const ME={id:'you',name:'You',role:'Player',color:'#22d3ee',cap:5};
const ids=(Q.get('ai')||'rex,vex,zip,ash').split(',');let ACTIVE=KINDS.filter(k=>ids.includes(k.id));if(!ACTIVE.length)ACTIVE=KINDS.slice(0,4);
const DIFF=[{every:30,rm:3,fm:2.2,lead:0,wob:.12},{every:14,rm:1.6,fm:1.4,lead:0,wob:.09},{every:6,rm:1,fm:1,lead:.6,wob:.06},{every:2,rm:0,fm:.7,lead:1,wob:.04}],dq=DIFF[LV]||DIFF[2];
let MEM=[],HEAT={},CTRL='wasd',FFA=false,mute=0;const ST={};
try{MEM=JSON.parse(localStorage.raytanks_mem||'[]').filter(m=>m.f&&m.f.length===8);HEAT=JSON.parse(localStorage.raytanks_heat||'{}');if(Array.isArray(HEAT))HEAT={};CTRL=localStorage.raytanks_ctrl||'wasd';FFA=localStorage.raytanks_ffa==='1'}catch(e){}
const saveMem=()=>{try{localStorage.raytanks_mem=JSON.stringify(MEM.slice(-3000));localStorage.raytanks_heat=JSON.stringify(HEAT)}catch(e){}};
let BX=!!window.planck;const V=BX?(x,y)=>new planck.Vec2(x,y):null;
let walls=[],grid=[],cells=[],tanks=[],bullets=[],state='menu',timer=0,round=0,layer=null,lctx=null,world=null,FT=-1,FF=[],SB=20,SHK=0,PT=[],EX=[],scoring=true,RB=0,RL=0;
const keys={};

// ================= AUDIO: layered synth, stereo-panned, compressed =================
let AC,MG,NB,NB2;
function au(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.threshold.value=-16;c.ratio.value=6;MG=AC.createGain();MG.gain.value=.85;MG.connect(c);c.connect(AC.destination);
 const n=AC.sampleRate*2|0;NB=AC.createBuffer(1,n,AC.sampleRate);NB2=AC.createBuffer(1,n,AC.sampleRate);const a=NB.getChannelData(0),b=NB2.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;a[i]=w;l=(l+.02*w)/1.02;b[i]=l*3.5}}return AC}
const outN=pan=>{if(pan==null||!AC.createStereoPanner)return MG;const p=AC.createStereoPanner();p.pan.value=clamp(pan,-.85,.85);p.connect(MG);return p};
function tone(f,d,ty,v,sl,pan,dl){if(mute)return;try{const c=au(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(dl||0);o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(outN(pan));o.start(t);o.stop(t+d+.03)}catch(e){}}
function nz(d,f0,f1,v,ty,pan,brown,dl){if(mute)return;try{const c=au(),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+(dl||0);s.buffer=brown?NB2:NB;f.type=ty;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(outN(pan));s.start(t,Math.random()*1.4,d+.03)}catch(e){}}
const px=x=>clamp(x/(COLS*S)*2-1,-.8,.8);
function sShot(t){const v=t.team===0?1:.45,p=px(t.x);nz(.08,2600,600,.45*v,'bandpass',p);tone(170,.15,'sine',.55*v,-115,p);tone(430,.05,'square',.05*v,-300,p)}
function sBoom(x){const p=px(x);nz(1,1800,50,1,'lowpass',p,true);tone(85,.8,'sine',.85,-55,p);nz(.25,7000,900,.45,'highpass',p);tone(480,.3,'triangle',.12,-380,p);[.09,.18,.28].forEach(d=>nz(.12,3000,500,.2,'bandpass',p,false,d))}
let lastTick=0;const sTick=(x,v)=>{const n=performance.now();if(n-lastTick<110)return;lastTick=n;nz(.03,1100,400,.1*v,'lowpass',px(x))};
const sBeat=i=>{if(i<2){tone(i?523:392,.28,'sine',.28);tone(i?262:196,.28,'triangle',.16)}else{nz(.4,400,5200,.45,'bandpass');tone(784,.45,'triangle',.26);tone(1175,.45,'triangle',.18);tone(98,.55,'sine',.55,-30)}};
const sUI=f=>tone(f,.09,'sine',.14);

// ================= MAZE =================
const cellOf=t=>({r:clamp(t.y/S|0,0,ROWS-1),c:clamp(t.x/S|0,0,COLS-1)});
function opn(r,c,dr,dc){const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=ROWS||nc>=COLS)return false;if(dc==1)return!cells[r*COLS+c].R;if(dc==-1)return!cells[r*COLS+nc].R;if(dr==1)return!cells[r*COLS+c].B;return!cells[nr*COLS+c].B}
const sizeFor=n=>n<=2?[8,5]:n===3?[9,6]:n===4?[10,6]:n===5?[11,7]:[12,7];
function makeMaze(){[COLS,ROWS]=sizeFor(1+ACTIVE.length);cv.width=COLS*S+2*P;cv.height=ROWS*S+2*P;cv.style.aspectRatio=cv.width+'/'+cv.height;cv.style.width='min(calc(100vw - 44px),calc((100vh - 104px)*'+(cv.width/cv.height).toFixed(3)+'))';
 cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({r,c,R:1,B:1,s:0,tint:rnd(3)});
 const at=(r,c)=>r<0||c<0||r>=ROWS||c>=COLS?null:cells[r*COLS+c],st=[cells[rnd(cells.length)]];st[0].s=1;
 while(st.length){const u=st[st.length-1],nb=D.map(([a,b])=>at(u.r+a,u.c+b)).filter(n=>n&&!n.s);if(!nb.length){st.pop();continue}
  const n=nb[rnd(nb.length)];if(n.r>u.r)u.B=0;else if(n.r<u.r)n.B=0;else if(n.c>u.c)u.R=0;else n.R=0;n.s=1;st.push(n)}
 const nk=Math.round(COLS*ROWS*(.1+Math.random()*.16));for(let i=0;i<nk;i++){const x=cells[rnd(cells.length)];if(Math.random()<.5)x.R=0;else x.B=0}
 let ns=0;const mx=Math.max(1,Math.round(COLS*ROWS*.06));
 for(const k of cells)if(ns<mx&&k.r>0&&k.c>0&&k.r<ROWS-1&&k.c<COLS-1&&Math.random()<.22&&D.filter(([a,b])=>opn(k.r,k.c,a,b)).length===1){k.solid=1;ns++;k.R=1;k.B=1;cells[k.r*COLS+k.c-1].R=1;cells[(k.r-1)*COLS+k.c].B=1}
 walls=[{x:-T/2,y:-T/2,w:COLS*S+T,h:T},{x:-T/2,y:ROWS*S-T/2,w:COLS*S+T,h:T},{x:-T/2,y:-T/2,w:T,h:ROWS*S+T},{x:COLS*S-T/2,y:-T/2,w:T,h:ROWS*S+T}];
 for(const k of cells){if(k.R&&k.c<COLS-1)walls.push({x:(k.c+1)*S-T/2,y:k.r*S-T/2,w:T,h:S+T});if(k.B&&k.r<ROWS-1)walls.push({x:k.c*S-T/2,y:(k.r+1)*S-T/2,w:S+T,h:T})}
 grid=cells.map(k=>walls.filter(w=>w.x<(k.c+1)*S+30&&w.x+w.w>k.c*S-30&&w.y<(k.r+1)*S+30&&w.y+w.h>k.r*S-30));layer=null;mkWorld()}
function path(a,b){const k=(r,c)=>r*COLS+c,prev={},q=[a];prev[k(a.r,a.c)]=-1;
 for(let i=0;i<q.length;i++){const u=q[i];for(const[dr,dc]of D)if(opn(u.r,u.c,dr,dc)){const n={r:u.r+dr,c:u.c+dc};if(prev[k(n.r,n.c)]===undefined){prev[k(n.r,n.c)]=k(u.r,u.c);q.push(n)}}}
 let cur=k(b.r,b.c);const A=k(a.r,a.c);if(cur==A||prev[cur]===undefined)return a;while(prev[cur]!==A)cur=prev[cur];return{r:cur/COLS|0,c:cur%COLS}}

// ================= COLLISION (shared by game + AI prediction; centre-inside-wall handled so nothing tunnels) =================
function bounce(b,r){const L=grid[clamp(b.y/S|0,0,ROWS-1)*COLS+clamp(b.x/S|0,0,COLS-1)]||walls;
 for(const w of L){if(Math.abs(b.x-w.x-w.w/2)>w.w/2+r+6||Math.abs(b.y-w.y-w.h/2)>w.h/2+r+6)continue;
  const cx=clamp(b.x,w.x,w.x+w.w),cy=clamp(b.y,w.y,w.y+w.h),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);let nx,ny;
  if(d===0){const l=b.x-w.x,rr=w.x+w.w-b.x,tp=b.y-w.y,bt=w.y+w.h-b.y,m=Math.min(l,rr,tp,bt);nx=ny=0;
   if(m===l){nx=-1;b.x=w.x-r-.1}else if(m===rr){nx=1;b.x=w.x+w.w+r+.1}else if(m===tp){ny=-1;b.y=w.y-r-.1}else{ny=1;b.y=w.y+w.h+r+.1}}
  else if(d<r){nx=dx/d;ny=dy/d;b.x=cx+nx*(r+.1);b.y=cy+ny*(r+.1)}else continue;
  if(b.vx!==undefined){const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny}}}}
function free(x,y,r=21){const o={x,y};bounce(o,r);return Math.hypot(o.x-x,o.y-y)<.5}

// ================= PHYSICS: Box2D (planck.js) with automatic fallback =================
function mkWorld(){if(!BX)return;world=new planck.World({gravity:V(0,0)});
 for(const w of walls){const b=world.createBody({type:'static',position:V((w.x+w.w/2)/PPM,(w.y+w.h/2)/PPM)});b.createFixture(new planck.Box(w.w/2/PPM,w.h/2/PPM),{friction:0,restitution:0,filterCategoryBits:1,filterMaskBits:0xFFFF})}}
function tankBody(t){if(!BX||!world)return null;const b=world.createBody({type:'dynamic',position:V(t.x/PPM,t.y/PPM),angle:t.a,fixedRotation:true}),fd={density:1,friction:0,restitution:0,filterCategoryBits:2,filterMaskBits:3};
 b.createFixture(new planck.Box(18/PPM,14.5/PPM),fd);b.createFixture(new planck.Box(5/PPM,4.5/PPM,V(23/PPM,0),0),fd);return b}
function mkBullet(b){b.body=world.createBody({type:'dynamic',bullet:true,position:V(b.x/PPM,b.y/PPM)});b.body.setLinearVelocity(V(b.vx*60/PPM,b.vy*60/PPM));
 b.body.createFixture(new planck.Circle(4/PPM),{density:1,friction:0,restitution:1,filterCategoryBits:4,filterMaskBits:1})}
function stepWorld(){if(!BX||!world)return;world.step(1/60,8,3);for(const t of tanks)if(t.body){const p=t.body.getPosition();t.x=p.x*PPM;t.y=p.y*PPM;t.body.setLinearVelocity(V(0,0))}}
function move(t,turn,f){t.a+=turn*.075;const v=f>0?SPD:f<0?-SPD*.74:0;
 if(BX&&t.body){t.body.setAngle(t.a);t.body.setLinearVelocity(V(Math.cos(t.a)*v*60/PPM,Math.sin(t.a)*v*60/PPM))}
 else{t.x+=Math.cos(t.a)*v;t.y+=Math.sin(t.a)*v;bounce(t,15);const X=t.x+Math.cos(t.a)*25,Y=t.y+Math.sin(t.a)*25,o={x:X,y:Y};bounce(o,5);t.x+=o.x-X;t.y+=o.y-Y}}
function shoot(t){if(!t.alive||t.cool>0||t.nb>=t.k.cap)return;t.cool=t.team===0?10:22*dq.fm;t.nb++;sShot(t);
 const b={x:t.x+Math.cos(t.a)*24,y:t.y+Math.sin(t.a)*24,vx:Math.cos(t.a)*BS,vy:Math.sin(t.a)*BS,life:480,age:0,o:t,fa:new Float32Array(122)};bullets.push(b);if(BX&&world)mkBullet(b)}

// ================= AI =================
function target(t){let b=null,bd=1e9;for(const e of tanks)if(e.alive&&e!==t&&(FFA||e.team!==t.team)){const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<bd){bd=d;b=e}}return b}

  if(i>3&&Math.hypot(b.x-t.x,b.y-t.y)<34){if(hi>=0&&i>=45)break;return 999}
  for(const e of al)if(Math.hypot(b.x-e.x,b.y-e.y)<20){if(hi>=0)break;return 998}
  let tx=p.x,ty=p.y;if(q){const e=q[Math.min(q.length-1,Math.round((i+1)*4/BS/3*dq.lead))];tx=e[0];ty=e[1]}
  const d=Math.hypot(b.x-tx,b.y-ty);if(d<m)m=d;if(d<13&&hi<0){hi=i;rb=RB}}

// incremental aim solver: spends at most `bud` ray-casts per frame so the game never hitches
function solveStep(t,p,bud){let u=0;const s=t.sq||(t.sq={c:[],i:0,r:null,j:0,best:null,bd:9});
 while(u<bud){
  if(!s.r){if(s.i<60){const a=s.i++/60*6.2832;s.c.push({a,d:ray(t,a,p)});u++;continue}
   const dir=Math.atan2(p.y-t.y,p.x-t.x);s.c.push({a:dir,d:ray(t,dir,p)});u++;s.c.sort((x,y)=>x.d-y.d);s.r=[];
   for(const q of s.c.slice(0,3)){if(q.d>70)break;for(let k=-4;k<=4;k++)s.r.push(q.a+k*.022)}s.j=0;continue}
  if(s.j<s.r.length){const a=s.r[s.j++];u++;if(okShot(t,a,p)){const d=Math.abs(angd(a,t.a));if(d<s.bd){s.bd=d;s.best=a}}continue}

 const cand=[];
 for(let j=0;j<16;j++){const a=j/16*6.2832;for(const back of[0,1]){const r=run(t.x,t.y,t.a,a,back,0,t.a),c=cellOf({x:r.x,y:r.y}),dead=D.filter(([u,v])=>opn(c.r,c.c,u,v)).length===1;

 cand.sort((x,y)=>y.sc-x.sc);let best=cand[0];
 for(const c of cand.slice(0,3)){if(c.r.ok>=33)break;const i0=Math.min(c.r.ok,10),mv=Math.max(0,i0*2-c.r.td)*(c.back?SPD*.74:SPD),x1=t.x+Math.cos(c.a)*mv,y1=t.y+Math.sin(c.a)*mv;
  for(let j=0;j<8;j++){const a2=c.a+j*.785+.39,back2=j%2,r2=run(x1,y1,c.r.hd,a2,back2,i0,c.r.hd);const sc=r2.ok*10+(r2.ok>=33?40:0)-r2.td*.25;if(sc>best.sc){best={a:c.a,back:c.back,sc}}}}

function exec(t,c){if(!c.back)return drive(t,c.a,1,1);const d=angd(c.a+Math.PI,t.a);move(t,clamp(d/.075,-1,1),Math.abs(d)<.6?-1:0)}
function drive(t,w,go,exact){const d=angd(w+(exact?0:t.wob),t.a);move(t,clamp(d/.075,-1,1),go&&Math.abs(d)<1.1?1:0)}

 for(let i=0;i<10;i++){const a=Math.random()*6.28,v=.3+Math.random()*1.8;PT.push({k:'m',x:x+Math.cos(a)*6,y:y+Math.sin(a)*6,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.3,r:6,l:55+rnd(30),m:85})}}
function drawSmoke(){for(const p of PT)if(p.k==='m'){const a=clamp(p.l/p.m,0,1)*.42;ctx.globalAlpha=a;ctx.fillStyle='#2a2a2d';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function drawFire(){for(const e of EX){const k=Math.min(1,e.l/24);
  if(k<.35){ctx.globalAlpha=1-k/.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,10+k*130,0,7);ctx.fill();ctx.globalAlpha=1}
  const r=16+k*62,g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r);g.addColorStop(0,'rgba(255,240,190,'+.95*(1-k)+')');g.addColorStop(.45,'rgba(255,140,30,'+.8*(1-k)+')');g.addColorStop(1,'rgba(200,40,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,r,0,7);ctx.fill();
  ctx.globalAlpha=(1-k)*.8;ctx.strokeStyle='#fff';ctx.lineWidth=3*(1-k)+1;ctx.beginPath();ctx.arc(e.x,e.y,8+k*120,0,7);ctx.stroke();ctx.globalAlpha=1}
 for(const p of PT){if(p.k==='s'){ctx.globalAlpha=clamp(p.l/20,0,1);ctx.strokeStyle=p.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.8,p.y-p.vy*1.8);ctx.stroke()}
  else if(p.k==='d'){ctx.globalAlpha=clamp(p.l/25,0,1);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.strokeStyle='#050506';ctx.lineWidth=1.5;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}}ctx.globalAlpha=1}
function stepFX(n){for(const e of EX)e.l+=n;EX=EX.filter(e=>e.l<26);
 for(const p of PT)for(let i=0;i<n;i++){p.x+=p.vx;p.y+=p.vy;p.l--;if(p.k==='d'){p.vx*=.95;p.vy*=.95;p.r+=p.vr;p.vr*=.97}else if(p.k==='m'){p.r+=.45;p.vx*=.98;p.vy*=.98}else{p.vx*=.9;p.vy*=.9}}
 PT=PT.filter(p=>p.l>0)}

// ================= INPUT / MENU / CAMP =================
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 try{au().resume()}catch(x){}
 if(state==='menu'&&e.key==='Enter'){startGame();return}
 if(k===(CTRL==='wasd'?'q':' ')&&!keys[k]&&(state==='play'||state==='ending')&&tanks[0]&&tanks[0].alive)shoot(tanks[0]);keys[k]=1;
 if(k==='m')toggleMute();if(k==='f')fullscreen()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
addEventListener('beforeunload',saveMem);setInterval(saveMem,5000);
const fullscreen=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
const toggleMute=()=>{mute^=1;$('mu').textContent=mute?'✕':'♪'};$('fs').onclick=fullscreen;$('mu').onclick=toggleMute;
const scrim=document.createElement('div');scrim.className='scrim';
function drawMenu(){scrim.innerHTML='<div class="panel"><h2>Get ready</h2><p>Pick your controls, then press Enter or tap Start.</p><div class="row">'+
 `<button class="opt ${CTRL==='wasd'?'on':''}" data-c="wasd"><b>W A S D</b><span>Fire: Q</span></button><button class="opt ${CTRL==='arrows'?'on':''}" data-c="arrows"><b>↑ ← ↓ →</b><span>Fire: Space</span></button></div>`+
 (CAMP?'':`<div style="margin-top:12px"><button class="opt camp ${FFA?'on':''}" data-f="1"><b style="font-size:17px;letter-spacing:1px">AIs fight each other: ${FFA?'ON':'OFF'}</b><span>${FFA?'Free-for-all. Everyone against everyone.':'The AIs team up against you.'}</span></button></div>`)+
 '<button class="go" data-go="1">START</button></div>'}
scrim.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){CTRL=b.dataset.c;sUI(600);drawMenu()}else if(b.dataset.f){FFA=!FFA;sUI(FFA?720:460);drawMenu()}else if(b.dataset.go)startGame()};
function startGame(){if(state!=='menu')return;if(CAMP)FFA=false;try{localStorage.raytanks_ctrl=CTRL;localStorage.raytanks_ffa=FFA?'1':'0'}catch(e){}scrim.remove();tone(660,.14,'sine',.2,200);newRound()}
drawMenu();document.querySelector('.stage').appendChild(scrim);
if(CAMP){const bar=document.createElement('div');bar.className='bar';
 bar.innerHTML='<b>Learning Camp</b><span id="cm" style="font-size:13px;color:var(--mut)"></span><div style="flex:1;min-width:120px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden"><i id="cb" style="display:block;height:100%;width:0;background:#f2f3f5;transition:width .4s"></i></div><a class="pill" href="?camp=1&ai=rex,ash&d=0">Train</a><a class="pill" href="?camp=1&ai=echo&d=2&test=1">Test Echo</a><a class="pill" href="#" id="rs">Reset</a>';
 document.querySelector('main').insertBefore(bar,document.querySelector('.stage'));$('rs').onclick=e=>{e.preventDefault();MEM=[];HEAT={};saveMem()};
 setInterval(()=>{$('cm').textContent=(TEST?'Testing Echo (not recording)':'Training: Echo is watching you')+' · '+MEM.length+' moves';$('cb').style.width=Math.min(100,MEM.length/30)+'%'},400)}

// ================= LOOP: locked 60 FPS, render right after each update (no added latency) =================
makeMaze();
let lastT=0,acc=0;
function loop(now){let ticks=0;
 try{const dt=lastT?now-lastT:16.667;lastT=now;
  if(Math.abs(dt-16.667)<2.6){update();ticks=1;acc=0}            // ~60Hz display: exactly one update per frame
  else{acc+=Math.min(100,dt);while(acc>=16.667&&ticks<3){update();acc-=16.667;ticks++}if(ticks>=3)acc=0}   // other refresh rates: capped to 60
  if(ticks){draw();const live=state!=='menu'&&state!=='freeze';if(live){stepFX(ticks);SHK=Math.max(0,SHK-ticks*.8)}
   const z=state==='count'?1+.06*Math.pow(1-timer/90,2):1;
   if(SHK>0||z!==1||cv._s){cv._s=SHK>0||z!==1;cv.style.transform=cv._s?'scale('+z.toFixed(4)+') translate('+((Math.random()-.5)*SHK).toFixed(1)+'px,'+((Math.random()-.5)*SHK).toFixed(1)+'px)':''}}}
 catch(e){console.error(e);if(BX){BX=false;world=null;tanks.forEach(t=>t.body=null);bullets.forEach(b=>b.body=null)}}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
