<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAY TANKS — AI Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,system-ui,Arial}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between}.brand{font-weight:1000;letter-spacing:.15em}.readout{display:flex;gap:8px}.chip{background:#0b0e16d9;border:1px solid #ffffff12;border-radius:12px;padding:9px 12px;color:#8e97aa;font-size:10px}.chip b{color:#fff;font-size:13px}
#controls{position:absolute;bottom:16px;left:18px;color:#717b91;font-size:11px}.gear{pointer-events:auto;position:absolute;right:18px;bottom:16px;border:1px solid #ffffff15;background:#0d111bd9;color:#fff;border-radius:12px;padding:10px;cursor:pointer}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#03040a99}.panel{width:min(500px,calc(100% - 30px));background:#0c1019f5;border:1px solid #ffffff17;border-radius:22px;padding:25px;box-shadow:0 30px 100px #000b}.panel h1{font-size:34px;margin:0 0 5px;letter-spacing:.05em}.muted{color:#818ba0;font-size:12px;margin-bottom:18px}.btn{width:100%;padding:13px;border-radius:12px;background:#141a27;border:1px solid #ffffff12;color:#fff;font-weight:900;margin-top:8px;cursor:pointer}.primary{background:linear-gradient(135deg,#7558ff,#a25dff);border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;justify-content:space-between;align-items:center}.on{color:#8f73ff}
#pause{display:none}.small{font-size:11px;color:#697389}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="top"><div class="brand">RAY TANKS</div><div class="readout"><div class="chip">TIME <b id="time">0.0</b></div><div class="chip">AI <b>3</b></div><div class="chip">FPS <b id="fps">--</b></div></div></div><div id="controls">WASD / ARROWS · drive · R restart · ESC pause</div><button class="gear" id="settingsBtn">⚙ SETTINGS</button></div>
<div id="overlay"><div class="panel" id="homePanel"><h1>AI ARENA</h1><div class="muted">PHYSICS ONLINE · TRAINING MEMORY READY</div><button class="btn primary" id="play">START MATCH</button><div class="grid"><button class="btn" id="custom">CUSTOMIZE</button><button class="btn" id="stats">STATS</button></div><button class="btn" id="back">BACK TO RAY TANKS</button></div>
<div class="panel" id="settingsPanel" style="display:none"><h1>SETTINGS</h1><div class="muted">MATCH OPTIONS</div><div class="grid"><button class="btn toggle" data-k="audio">AUDIO <b>ON</b></button><button class="btn toggle" data-k="music">MUSIC <b>ON</b></button><button class="btn toggle" data-k="shake">SCREEN SHAKE <b>ON</b></button><button class="btn toggle" data-k="training">AI TRAINING <b>ON</b></button><button class="btn toggle" data-k="skins">TANK SKINS <b>ON</b></button><button class="btn toggle" data-k="effects">FX <b>ON</b></button></div><button class="btn" id="closeSettings">DONE</button></div>
<div class="panel" id="customPanel" style="display:none"><h1>CUSTOMIZE</h1><div class="muted">YOUR TANK</div><div class="grid"><button class="btn" data-color="#66d9ff">CYAN</button><button class="btn" data-color="#9d7cff">VIOLET</button><button class="btn" data-color="#7df29a">MINT</button><button class="btn" data-color="#ffcf68">GOLD</button></div><button class="btn" id="closeCustom">DONE</button></div>
<div class="panel" id="statsPanel" style="display:none"><h1>STATS</h1><div class="muted" id="statsText"></div><button class="btn" id="closeStats">DONE</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/planck-js@1.4.2/dist/planck.min.js"></script>
<script>
(()=>{const P=planck,V=P.Vec2,c=document.getElementById('c'),x=c.getContext('2d');let world,ps=[],run=false,last=0,acc=0,fps=60,start=0,color='#66d9ff',opts={audio:true,music:true,shake:true,training:true,skins:true,effects:true},stats=JSON.parse(localStorage.getItem('raytanks_stats')||'{"rounds":0,"wins":0,"survival":0}');
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}addEventListener('resize',size);size();
let keys=new Set;onkeydown=e=>{keys.add(e.key.toLowerCase());if(e.key==='Escape')show('homePanel');if(e.key.toLowerCase()==='r'&&run)startGame()};onkeyup=e=>keys.delete(e.key.toLowerCase());
function wall(a,b,w,h){let q=world.createBody({position:V(a,b)});q.createFixture(P.Box(w/2,h/2),{friction:.8,restitution:.45})}
function tank(a,b,ang,col,ai){let q=world.createDynamicBody({position:V(a,b),angle:ang});q.createFixture(P.Box(1.05,.72),{density:1.4,friction:.72,restitution:.25});q.setLinearDamping(.8);q.setAngularDamping(3.5);q.setUserData({col,ai});return q}
function startGame(){world=new P.World(V(0,0));wall(20,-.3,40,.6);wall(20,24.3,40,.6);wall(-.3,12,.6,24);wall(40.3,12,.6,24);ps=[{b:tank(5,5,0,color,0)},{b:tank(35,5,3.1,'#ff668b',1)},{b:tank(35,19,-3.1,'#ffd166',1)},{b:tank(5,19,.2,'#7df29a',1)}];run=true;start=performance.now();document.getElementById('overlay').style.display='none';last=performance.now();loop(last)}
function step(){ps.forEach((p,i)=>{let q=p.b,a=q.getAngle(),th=0,st=0;if(!p.ai){if(keys.has('w')||keys.has('arrowup'))th=1;if(keys.has('s')||keys.has('arrowdown'))th=-.65;if(keys.has('a')||keys.has('arrowleft'))st=-1;if(keys.has('d')||keys.has('arrowright'))st=1}else{let pos=q.getPosition(),t=Math.atan2(12-pos.y,20-pos.x),d=Math.atan2(Math.sin(t-a),Math.cos(t-a));st=Math.max(-1,Math.min(1,d*2));th=Math.abs(d)<2?1:.2}q.applyForceToCenter(V(Math.cos(a)*th*48,Math.sin(a)*th*48),true);q.applyTorque(st*18,true)});world.step(1/60,8,3)}
function draw(){let s=Math.min(innerWidth/40,innerHeight/24),ox=(innerWidth-40*s)/2,oy=(innerHeight-24*s)/2;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.clearRect(0,0,innerWidth,innerHeight);x.fillStyle='#060810';x.fillRect(0,0,innerWidth,innerHeight);x.save();x.translate(ox,oy);x.scale(s,s);x.fillStyle='#0a0e17';x.fillRect(0,0,40,24);x.strokeStyle='#1b2434';x.lineWidth=.06;for(let i=1;i<40;i++){x.beginPath();x.moveTo(i,0);x.lineTo(i,24);x.stroke()}for(let i=1;i<24;i++){x.beginPath();x.moveTo(0,i);x.lineTo(40,i);x.stroke()}x.strokeStyle='#46516a';x.lineWidth=.25;x.strokeRect(.35,.35,39.3,23.3);ps.forEach((p,i)=>{let q=p.b,pos=q.getPosition(),a=q.getAngle(),u=q.getUserData();x.save();x.translate(pos.x,pos.y);x.rotate(a);x.shadowBlur=14;x.shadowColor=u.col;x.fillStyle=u.col;x.beginPath();x.roundRect(-1.05,-.72,2.1,1.44,.2);x.fill();x.shadowBlur=0;x.fillStyle='#070910';x.fillRect(.1,-.23,1.2,.46);x.restore();if(i===0){x.fillStyle='#fff';x.font='700 .48px system-ui';x.textAlign='center';x.fillText('YOU',pos.x,pos.y-1.1)}});x.restore()}
function loop(t){if(!run)return;let dt=Math.min(.1,(t-last)/1000);last=t;fps=fps*.9+(1/dt)*.1;acc+=dt;while(acc>=1/60){step();acc-=1/60}draw();time.textContent=((t-start)/1000).toFixed(1);document.getElementById('fps').textContent=Math.round(fps);requestAnimationFrame(loop)}
function show(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';document.getElementById('overlay').style.display='grid'}
play.onclick=startGame;back.onclick=()=>location.href='/';settingsBtn.onclick=()=>show('settingsPanel');closeSettings.onclick=()=>show('homePanel');custom.onclick=()=>show('customPanel');closeCustom.onclick=()=>show('homePanel');stats.onclick=()=>{let s=stats;statsText.textContent=`Rounds: ${s.rounds||0} · Wins: ${s.wins||0} · Survival: ${Math.round(s.survival||0)}s`;show('statsPanel')};closeStats.onclick=()=>show('homePanel');
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;opts[k]=!opts[k];b.querySelector('b').textContent=opts[k]?'ON':'OFF';b.querySelector('b').className=opts[k]?'on':''});
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);
})();
</script></body></html>
