<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TankForge — Arena</title>
<style>
:root{--bg:#070a10;--panel:#101722cc;--panel2:#151d29ee;--line:#ffffff14;--text:#eef6ff;--muted:#91a0b5;--accent:#58b9ff;--danger:#ff6b8a;--good:#62e7a4;--shadow:0 24px 80px #0009}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;border:0;cursor:pointer;color:inherit}.shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#15304a 0,transparent 38%),#070a10}
#game{width:min(1180px,100vw);height:min(720px,100vh);display:block;background:#0b1018;box-shadow:var(--shadow);border:1px solid var(--line);border-radius:24px}
.hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(1140px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.pill,.hud button{pointer-events:auto;background:#0e1621cc;border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px #0005}.brand{font-weight:850;letter-spacing:-.5px}.brand span{color:var(--accent)}.stats{display:flex;gap:8px}.stat b{font-size:15px}.stat small{color:var(--muted);margin-left:4px}.hud button{padding:10px 12px}
.overlay{position:fixed;inset:0;background:#03060bb8;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.modal{width:min(700px,100%);background:#101722f2;border:1px solid #ffffff18;border-radius:28px;padding:30px;box-shadow:0 30px 110px #000b}.modal h1{margin:0;font-size:42px;letter-spacing:-2px}.modal p{color:var(--muted);line-height:1.6}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{padding:13px 17px;border-radius:14px;background:#1a2533;border:1px solid var(--line);font-weight:750}.btn.primary{background:#f5f9ff;color:#07101a}.btn.danger{background:#321722;color:#ff9bb0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.card{padding:18px;border-radius:18px;background:#0b111a;border:1px solid var(--line)}.card.active{border-color:#58b9ff88;box-shadow:0 0 0 1px #58b9ff22 inset}.card b{display:block;margin-bottom:5px}.card small{color:var(--muted);line-height:1.4}.bar{height:6px;background:#1b2634;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);width:50%}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#738399;font-size:12px;background:#0b111acc;border:1px solid var(--line);padding:8px 13px;border-radius:999px;backdrop-filter:blur(15px)}
@media(max-width:700px){#game{border-radius:0;width:100vw;height:100vh}.hud{top:10px;width:calc(100% - 20px)}.stats{display:none}.modal h1{font-size:34px}.cards{grid-template-columns:1fr}.controls{bottom:10px}}
</style></head>
<body>
<div class="shell"><canvas id="game"></canvas></div>
<div class="hud"><div class="pill brand">TANK<span>FORGE</span></div><div class="stats"><div class="pill stat"><b id="score">0</b><small>kills</small></div><div class="pill stat"><b id="alive">0</b><small>AI alive</small></div><div class="pill stat"><b id="time">0:00</b><small>time</small></div></div><button class="pill" id="pauseBtn">Ⅱ</button></div>
<div class="controls">W/S move · A/D turn · Q fire · P pause · ESC menu</div>
<div class="overlay show" id="menu"><div class="modal"><h1 id="menuTitle">Choose your fight.</h1><p id="menuText">Three original AI personalities share the same physics as you. Survive the arena.</p><div class="cards" id="aiCards"><button class="card active" data-ai="3"><b>⚔️ Full Arena</b><small>Scout + Sentinel + Hybrid</small><div class="bar"><i style="width:100%"></i></div></button><button class="card" data-ai="1"><b>🟢 Scout</b><small>Fast, aggressive pressure.</small><div class="bar"><i style="width:45%"></i></div></button><button class="card" data-ai="2"><b>🔵 Sentinel</b><small>Defensive precision and patience.</small><div class="bar"><i style="width:70%"></i></div></button></div><div class="row"><button class="btn primary" id="startBtn">START ARENA →</button><button class="btn" id="homeBtn">← Home</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=1100,H=650,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(1180,innerWidth);H=Math.min(720,innerHeight);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['q','w','a','s','d'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='p')togglePause();if(e.key==='Escape')openMenu('Paused')});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const menu=document.getElementById('menu'),scoreEl=document.getElementById('score'),aliveEl=document.getElementById('alive'),timeEl=document.getElementById('time');let paused=true,started=false,selected=3,startTime=0,kills=0;
document.querySelectorAll('[data-ai]').forEach(c=>c.onclick=()=>{selected=+c.dataset.ai;document.querySelectorAll('[data-ai]').forEach(x=>x.classList.toggle('active',x===c))});
document.getElementById('startBtn').onclick=()=>start();document.getElementById('homeBtn').onclick=()=>location.href='../index.html';document.getElementById('pauseBtn').onclick=togglePause;
function openMenu(title='Choose your fight.'){document.getElementById('menuTitle').textContent=title;document.getElementById('menuText').textContent=title==='Paused'?'Take a breath. Resume when ready.':'Three original AI personalities share the same physics as you. Survive the arena.';menu.classList.add('show');paused=true}
function closeMenu(){menu.classList.remove('show');paused=false}
function togglePause(){if(!started)return;paused=!paused;menu.classList.toggle('show',paused);if(paused){document.getElementById('menuTitle').textContent='Paused';document.getElementById('menuText').textContent='Take a breath. Resume when ready.'}else{menu.classList.remove('show');last=performance.now()}}
const walls=[];let mazeCells=[];const MAZE_COLS=15,MAZE_ROWS=9;function makeMap(){walls.length=0;const cw=W/MAZE_COLS,ch=H/MAZE_ROWS;const seen=Array.from({length:MAZE_ROWS},()=>Array(MAZE_COLS).fill(false));const edges=Array.from({length:MAZE_ROWS},()=>Array.from({length:MAZE_COLS},()=>({r:1,b:1})));const stack=[[0,0]];seen[0][0]=true;while(stack.length){const [c,r]=stack[stack.length-1],opts=[];if(c>0&&!seen[r][c-1])opts.push([-1,0,'l']);if(c<MAZE_COLS-1&&!seen[r][c+1])opts.push([1,0,'r']);if(r>0&&!seen[r-1][c])opts.push([0,-1,'t']);if(r<MAZE_ROWS-1&&!seen[r+1][c])opts.push([0,1,'b']);if(!opts.length){stack.pop();continue}const [dx,dy,dir]=opts[Math.floor(Math.random()*opts.length)],nc=c+dx,nr=r+dy;seen[nr][nc]=true;if(dir==='r')edges[r][c].r=0;else if(dir==='b')edges[r][c].b=0;else if(dir==='l')edges[r][c-1].r=0;else edges[r-1][c].b=0;stack.push([nc,nr])}const gap=Math.max(8,Math.min(14,Math.min(cw,ch)*.14));for(let r=0;r<MAZE_ROWS;r++)for(let c=0;c<MAZE_COLS;c++){const x=c*cw,y=r*ch;if(edges[r][c].r)walls.push({x:x+cw-gap/2,y,w:gap,h:ch+gap/2});if(edges[r][c].b)walls.push({x,y:y+ch-gap/2,w:cw+gap/2,h:gap})}walls.push({x:0,y:0,w:W,h:gap/2},{x:0,y:H-gap/2,w:W,h:gap/2},{x:0,y:0,w:gap/2,h:H},{x:W-gap/2,y:0,w:gap/2,h:H});mazeCells=Array.from({length:MAZE_ROWS},(_,r)=>Array.from({length:MAZE_COLS},(_,c)=>({x:c*cw+cw/2,y:r*ch+ch/2})))}makeMap();addEventListener('resize',()=>{makeMap();if(started)spawn()});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function circleRect(c,r,q){const x=clamp(c.x,q.x,q.x+q.w),y=clamp(c.y,q.y,q.y+q.h);return Math.hypot(c.x-x,c.y-y)<r}
function blocked(x,y,r){return x<r||x>W-r||y<r||y>H-r||walls.some(q=>circleRect({x,y},r,q))}
class Bullet{constructor(t){this.x=t.x+Math.cos(t.a)*25;this.y=t.y+Math.sin(t.a)*25;this.vx=Math.cos(t.a)*480;this.vy=Math.sin(t.a)*480;this.owner=t;this.life=4;this.r=4;this.bounces=0}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;if(this.x<this.r||this.x>W-this.r){this.vx*=-1;this.x=clamp(this.x,this.r,W-this.r);this.bounces++}if(this.y<this.r||this.y>H-this.r){this.vy*=-1;this.y=clamp(this.y,this.r,H-this.r);this.bounces++}for(const q of walls){if(circleRect(this,this.r,q)){const cx=clamp(this.x,q.x,q.x+q.w),cy=clamp(this.y,q.y,q.y+q.h);if(Math.abs(this.x-cx)>Math.abs(this.y-cy))this.vx*=-1;else this.vy*=-1;this.bounces++;this.x+=this.vx*dt*2;this.y+=this.vy*dt*2}}return this.life>0&&this.bounces<8}}
class Tank{constructor(x,y,color,name,role,player=false){this.x=x;this.y=y;this.a=player?0:Math.random()*Math.PI*2;this.color=color;this.name=name;this.role=role;this.player=player;this.r=17;this.speed=185;this.turn=3.2;this.cool=0;this.alive=true;this.hp=1;this.aiThink=0;this.targetA=0;this.strafe=1;this.shots=0}
fire(){if(this.cool>0||!this.alive)return;bullets.push(new Bullet(this));this.cool=.45;this.shots++}
move(dt,forward){const nx=this.x+Math.cos(this.a)*this.speed*forward*dt,ny=this.y+Math.sin(this.a)*this.speed*forward*dt;if(!blocked(nx,this.y,this.r))this.x=nx;if(!blocked(this.x,ny,this.r))this.y=ny}
update(dt){if(!this.alive)return;this.cool-=dt;if(this.player){let f=(keys.has('w')?1:0)-(keys.has('s')?1:0);let t=(keys.has('d')?1:0)-(keys.has('a')?1:0);this.a+=t*this.turn*dt;this.move(dt,f);if(keys.has('q'))this.fire();return}this.ai(dt)}
ai(dt){const target=player;if(!target.alive)return;this.aiThink-=dt;const dx=target.x-this.x,dy=target.y-this.y;const desired=Math.atan2(dy,dx);if(this.role==='hybrid'){const lead=clamp(dist(this,target)/430,0,.7);this.targetA=desired+lead*(Math.sin(target.a)*.3)}else this.targetA=desired;let d=angDiff(this.targetA,this.a);this.a+=clamp(d,-this.turn*dt,this.turn*dt);const danger=bullets.some(b=>b.owner!==this&&dist(this,b)<110);if(danger){this.strafe=dist(this,target)>300?1:-1;this.a+=this.strafe*this.turn*.65*dt;this.move(dt,1)}else if(this.role==='scout'){this.move(dt,dist(this,target)>260?1:.35);if(Math.abs(d)<.12)this.fire()}else if(this.role==='sentinel'){if(dist(this,target)<260)this.move(dt,-.35);else if(dist(this,target)>430)this.move(dt,.5);if(Math.abs(d)<.08)this.fire()}else{this.move(dt,dist(this,target)>310?1:.45);if(Math.abs(d)<.08)this.fire()}}
draw(){if(!this.alive)return;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a);ctx.shadowBlur=18;ctx.shadowColor=this.color;ctx.fillStyle=this.color;ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(0,0,23,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#101722';ctx.fillRect(-15,-12,30,24);ctx.fillStyle=this.color;ctx.fillRect(-11,-9,22,18);ctx.fillStyle='#dff5ff';ctx.fillRect(3,-3,25,6);ctx.restore()}}
let player,bots=[],bullets=[],particles=[];function spawn(){const starts=[mazeCells[0][0],mazeCells[MAZE_ROWS-1][MAZE_COLS-1],mazeCells[0][MAZE_COLS-1],mazeCells[MAZE_ROWS-1][0]];player=new Tank(starts[0].x,starts[0].y,'#58b9ff','YOU','player',true);player.a=0;bots=[];const specs=[['#69e7a7','SCOUT','scout'],['#8f9dff','SENTINEL','sentinel'],['#ff6f93','HYBRID','hybrid']];for(let i=0;i<selected;i++){const s=specs[i],pos=starts[i+1];const b=new Tank(pos.x,pos.y,s[0],s[1],s[2]);b.a=Math.atan2(player.y-b.y,player.x-b.x);bots.push(b)}bullets=[];particles=[];kills=0;startTime=performance.now();started=true;closeMenu();saveStat('matches',1)}
function burst(x,y,color){for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:.45,c:color})}
function update(dt){if(paused)return;player.update(dt);bots.forEach(b=>b.update(dt));bullets=bullets.filter(b=>{if(!b.update(dt))return false;const tanks=[player,...bots];for(const t of tanks){if(t.alive&&t!==b.owner&&dist(t,b.x?b:{x:b.x,y:b.y})<t.r+b.r){t.alive=false;burst(t.x,t.y,t.color);if(b.owner===player){kills++;saveStat('kills',1)}else if(t===player)saveStat('deaths',1);return false}}return true});particles=particles.filter(p=>(p.x+=p.vx*dt,p.y+=p.vy*dt,p.l-=dt,p.l>0));const alive=bots.filter(b=>b.alive).length;scoreEl.textContent=kills;aliveEl.textContent=alive;timeEl.textContent=fmt((performance.now()-startTime)/1000);if(!player.alive||alive===0)endRound()}
function endRound(){paused=true;const won=player.alive;saveStat(won?'wins':'losses',1);document.getElementById('menuTitle').textContent=won?'ARENA CLEARED 🔥':'TANK DOWN';document.getElementById('menuText').textContent=won?`You eliminated ${selected} AI opponent${selected===1?'':'s'} in ${timeEl.textContent}.`:'The Forge got you this time. Run it back.';document.getElementById('startBtn').textContent='RUN IT BACK →';menu.classList.add('show')}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function saveStat(k,n){const o=JSON.parse(localStorage.getItem('tankforge_stats')||'{}');o[k]=(o[k]||0)+n;localStorage.setItem('tankforge_stats',JSON.stringify(o))}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b131e');g.addColorStop(1,'#080c13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#0b1118';ctx.fillRect(0,0,W,H);walls.forEach(q=>{ctx.fillStyle='#263443';ctx.shadowBlur=8;ctx.shadowColor='#000';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.shadowBlur=0;ctx.strokeStyle='#52627455';ctx.strokeRect(q.x,q.y,q.w,q.h)});bullets.forEach(b=>{ctx.fillStyle=b.owner.color;ctx.shadowBlur=15;ctx.shadowColor=b.owner.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/.45);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;player?.draw();bots.forEach(b=>b.draw())}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){selected=selected||3;spawn();localStorage.setItem('tankforge_ai_count',selected)}
const saved=+(new URLSearchParams(location.search).get('ai')||localStorage.getItem('tankforge_ai_count')||3);selected=clamp(saved,1,3);document.querySelectorAll('[data-ai]').forEach(x=>x.classList.toggle('active',+x.dataset.ai===selected));
</script></body></html>
