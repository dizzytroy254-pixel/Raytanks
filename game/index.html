<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAY TANKS — PLAY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,system-ui,Arial}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;top:17px;left:18px;font-weight:1000;letter-spacing:.14em;font-size:14px}.brand span{color:#a36bff}.stats{position:absolute;top:15px;right:18px;display:flex;gap:6px}.chip{background:#090c13e8;border:1px solid #ffffff12;border-radius:10px;padding:8px 10px;color:#7b8599;font-size:9px}.chip b{color:#fff;font-size:12px}.help{position:absolute;bottom:16px;left:18px;color:#5f697d;font-size:10px}.menuBtn{position:absolute;right:18px;bottom:14px;pointer-events:auto;background:#090c13e8;color:#fff;border:1px solid #ffffff14;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}
#screen{position:absolute;inset:0;display:grid;place-items:center;background:#020308a8;backdrop-filter:blur(5px)}.panel{width:min(480px,calc(100% - 28px));background:#0b0e15;border:1px solid #ffffff16;border-radius:20px;padding:25px;box-shadow:0 30px 100px #000}.panel h1{margin:0;font-size:31px}.sub{color:#737d91;font-size:10px;letter-spacing:.14em;margin:6px 0 18px}.btn{width:100%;margin-top:8px;padding:13px;border-radius:11px;background:#11151e;color:#fff;border:1px solid #ffffff12;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#7045ff,#a661ff)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.toggle{display:flex;justify-content:space-between}.toggle b{color:#a16dff}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.color{height:44px;border-radius:10px;border:2px solid transparent;cursor:pointer}.color.active{border-color:#fff}
</style></head><body><canvas id="game"></canvas>
<div id="hud"><div class="brand">RAY <span>TANKS</span></div><div class="stats"><div class="chip">TIME <b id="time">0.0</b></div><div class="chip">FPS <b id="fps">60</b></div></div><div class="help">WASD / ARROWS · DRIVE · R RESTART · ESC MENU</div><button class="menuBtn" id="menu">MENU</button></div>
<div id="screen"><div class="panel" id="main"><h1>AI ARENA</h1><div class="sub">MATCH READY</div><button class="btn primary" id="start">PLAY NOW</button><div class="grid"><button class="btn" id="custom">CUSTOMIZE</button><button class="btn" id="stats">STATS</button></div><button class="btn" id="home">← HOME</button></div>
<div class="panel hidden" id="customPanel"><h1>CUSTOMIZE</h1><div class="sub">CHOOSE YOUR TANK</div><div class="colors"><button class="color active" data-c="#66d9ff" style="background:#66d9ff"></button><button class="color" data-c="#a77bff" style="background:#a77bff"></button><button class="color" data-c="#7df29a" style="background:#7df29a"></button><button class="color" data-c="#ffd166" style="background:#ffd166"></button></div><button class="btn" id="customDone">DONE</button></div>
<div class="panel hidden" id="settingsPanel"><h1>SETTINGS</h1><div class="sub">OPTIONS</div><div class="grid"><button class="btn toggle" data-o="audio">AUDIO <b>ON</b></button><button class="btn toggle" data-o="fx">FX <b>ON</b></button><button class="btn toggle" data-o="training">AI TRAINING <b>ON</b></button><button class="btn toggle" data-o="shake">SCREEN SHAKE <b>ON</b></button></div><button class="btn" id="settingsDone">DONE</button></div>
<div class="panel hidden" id="statsPanel"><h1>STATS</h1><div class="sub">LOCAL PROFILE</div><div class="grid"><button class="btn">ROUNDS <b id="sr">0</b></button><button class="btn">WINS <b id="sw">0</b></button><button class="btn">SURVIVAL <b id="ss">0s</b></button><button class="btn">BEST <b id="sb">—</b></button></div><button class="btn" id="statsDone">DONE</button></div></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),screen=document.getElementById('screen');
var panels={main:document.getElementById('main'),custom:document.getElementById('customPanel'),settings:document.getElementById('settingsPanel'),stats:document.getElementById('statsPanel')};
var running=false,keys={},t0=0,last=0,raf=0,color=localStorage.getItem('raytanks_color')||'#66d9ff';
var opts={audio:true,fx:true,training:true,shake:true},me=null,ais=[];
var data={rounds:0,wins:0,survival:0,best:0};try{data=Object.assign(data,JSON.parse(localStorage.getItem('raytanks_stats')||'{}'))}catch(e){}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();
onkeydown=function(e){keys[e.key.toLowerCase()]=true;if(e.key==='Escape')show('main');if(e.key.toLowerCase()==='r'&&running)startGame()};
onkeyup=function(e){keys[e.key.toLowerCase()]=false};
function show(n){for(var k in panels)panels[k].classList.add('hidden');panels[n].classList.remove('hidden');screen.style.display='grid'}
function hide(){screen.style.display='none'}
function pos(x,y,c,a){return{x:x,y:y,c:c,a:a,vx:0,vy:0,spin:0}}
function startGame(){me=pos(6,6,color,0);ais=[pos(34,6,'#ff668b',3.14),pos(34,18,'#ffd166',-2.7),pos(6,18,'#7df29a',-.3)];running=true;t0=performance.now();last=t0;hide();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function update(p,ai,dt){var throttle=0,turn=0;if(!ai){if(keys.w||keys.arrowup)throttle=1;if(keys.s||keys.arrowdown)throttle=-.6;if(keys.a||keys.arrowleft)turn=-1;if(keys.d||keys.arrowright)turn=1}else{var tx=20,ty=12,dx=tx-p.x,dy=ty-p.y,target=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(target-p.a),Math.cos(target-p.a));turn=Math.max(-1,Math.min(1,diff*2));throttle=Math.abs(diff)<2?1:.2}
p.vx+=Math.cos(p.a)*throttle*18*dt;p.vy+=Math.sin(p.a)*throttle*18*dt;p.a+=turn*3.3*dt;p.vx*=Math.pow(.82,dt*60);p.vy*=Math.pow(.82,dt*60);p.x+=p.vx*dt;p.y+=p.vy*dt;
if(p.x<1)p.x=1;if(p.x>39)p.x=39;if(p.y<1)p.y=1;if(p.y>23)p.y=23}
function draw(){var d=devicePixelRatio,s=Math.min(innerWidth/40,innerHeight/24),ox=(innerWidth-40*s)/2,oy=(innerHeight-24*s)/2;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#05070c';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);ctx.fillStyle='#090d15';ctx.fillRect(0,0,40,24);ctx.strokeStyle='#182033';ctx.lineWidth=.06;for(var i=1;i<40;i++){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,24);ctx.stroke()}for(var j=1;j<24;j++){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(40,j);ctx.stroke()}ctx.strokeStyle='#46516a';ctx.lineWidth=.25;ctx.strokeRect(.35,.35,39.3,23.3);[me].concat(ais).forEach(function(p,i){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.shadowBlur=opts.fx?15:0;ctx.shadowColor=p.c;ctx.fillStyle=p.c;ctx.beginPath();ctx.roundRect(-1.05,-.72,2.1,1.44,.2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#080a10';ctx.fillRect(.1,-.23,1.15,.46);ctx.restore();if(i===0){ctx.fillStyle='#fff';ctx.font='800 .45px system-ui';ctx.textAlign='center';ctx.fillText('YOU',p.x,p.y-1.1)}});ctx.restore()}
function loop(now){if(!running)return;var dt=Math.min(.033,(now-last)/1000);last=now;update(me,false,dt);ais.forEach(function(a){update(a,true,dt)});draw();document.getElementById('time').textContent=((now-t0)/1000).toFixed(1);raf=requestAnimationFrame(loop)}
function menu(){running=false;show('main')}
document.getElementById('start').onclick=startGame;document.getElementById('menu').onclick=menu;document.getElementById('home').onclick=function(){location.href='/'};
document.getElementById('custom').onclick=function(){show('custom')};document.getElementById('customDone').onclick=function(){localStorage.setItem('raytanks_color',color);show('main')};
document.getElementById('settingsDone').onclick=function(){localStorage.setItem('raytanks_options',JSON.stringify(opts));show('main')};
document.getElementById('stats').onclick=function(){document.getElementById('sr').textContent=data.rounds;document.getElementById('sw').textContent=data.wins;document.getElementById('ss').textContent=Math.round(data.survival)+'s';document.getElementById('sb').textContent=data.best?Math.round(data.best)+'s':'—';show('stats')};
document.getElementById('statsDone').onclick=function(){show('main')};
document.getElementById('settingsBtn') && document.getElementById('settingsBtn').addEventListener('click',function(){show('settings')});
document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-c]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');color=b.getAttribute('data-c')}});
document.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-o');opts[k]=!opts[k];b.querySelector('b').textContent=opts[k]?'ON':'OFF'}});
})();
</script></body></html>
