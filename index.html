<!DOCTYPE html>
<!-- FILE: index.html  |  THE HOMEPAGE  |  goes in the ROOT (main folder) of your repo -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAYTANKS</title>
<meta name="theme-color" content="#0d0e11">
<meta name="description" content="RAYTANKS: ricochet tank duels against elite AI.">
<meta property="og:title" content="RAYTANKS"><meta property="og:description" content="Ricochet tank duels against elite AI."><meta property="og:image" content="https://raytanks.vercel.app/preview.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Cg transform='rotate%28-28 32 32%29'%3E%3Crect x='13' y='20' width='34' height='24' fill='%23262a31' stroke='%23050506' stroke-width='2'/%3E%3Crect x='14' y='21' width='32' height='5' fill='%23d5d7db'/%3E%3Crect x='14' y='38' width='32' height='5' fill='%23d5d7db'/%3E%3Crect x='30' y='29' width='24' height='6' fill='%2322d3ee' stroke='%23050506' stroke-width='2'/%3E%3Crect x='51' y='28' width='6' height='8' fill='%230e7490' stroke='%23050506' stroke-width='2'/%3E%3Ccircle cx='29' cy='32' r='9.5' fill='%2322d3ee' stroke='%23050506' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{--line:rgba(255,255,255,.1);--txt:#eceef2;--mut:#9aa0ab;--card:rgba(34,36,42,.72)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--txt);background:#0d0e11}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(110% 70% at 50% -10%,#1f2128 0,#0d0e11 62%)}
button{font:inherit;color:inherit}
main{max-width:820px;margin:0 auto;padding:44px 16px 64px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.logo svg{width:72px;height:72px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.6))}
h1{margin:0;font-size:clamp(40px,10vw,84px);font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#fff,#a9afba);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--mut);font-size:16px;text-align:center}
.panel{border-radius:28px;padding:20px;background:var(--card);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
h2{margin:0;font-size:18px;letter-spacing:.3px}#cnt{font-size:13px;color:var(--mut);font-weight:600}#cnt.bad{color:#ff9a9a}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{position:relative;cursor:pointer;text-align:left;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);transition:transform .22s cubic-bezier(.3,1.5,.5,1),background .2s,border-color .2s}
.card:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)}.card:active{transform:scale(.97)}
.card.on{border-color:#fff;background:rgba(255,255,255,.12)}
.card b{display:flex;align-items:center;gap:9px;font-size:16px}.card b i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.card em{font-style:normal;font-size:12px;color:var(--mut);margin-left:auto;font-weight:600}
.card p{margin:6px 0 0;font-size:13px;color:var(--mut);line-height:1.4;padding-right:26px}
.card:after{content:"✓";position:absolute;right:13px;bottom:11px;width:22px;height:22px;border-radius:50%;background:#fff;color:#0d0e11;font-size:13px;font-weight:800;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:.22s cubic-bezier(.3,1.6,.5,1)}
.card.on:after{opacity:1;transform:scale(1)}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:999px;background:rgba(0,0,0,.35)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:999px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;cursor:pointer;border:0;background:transparent;font-weight:700;font-size:14px;padding:12px 4px;border-radius:999px;color:var(--mut);transition:color .2s}
.seg button.on{color:#fff}.seg button:active{transform:scale(.95)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}
.pill:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.play{cursor:pointer;border:0;font-size:22px;font-weight:800;letter-spacing:4px;padding:20px;border-radius:999px;background:#f2f3f5;color:#0d0e11;box-shadow:0 14px 40px rgba(255,255,255,.12);transition:transform .22s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
.play:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 18px 50px rgba(255,255,255,.2)}.play:active{transform:scale(.97)}
.note{margin:0;text-align:center;font-size:13px;color:var(--mut);line-height:1.7}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<main>
  <div class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#15161a"/><g transform="rotate(-28 32 32)"><rect x="13" y="20" width="34" height="24" fill="#262a31" stroke="#050506" stroke-width="2"/><rect x="14" y="21" width="32" height="5" fill="#d5d7db"/><rect x="14" y="38" width="32" height="5" fill="#d5d7db"/><rect x="30" y="29" width="24" height="6" fill="#22d3ee" stroke="#050506" stroke-width="2"/><circle cx="29" cy="32" r="9.5" fill="#22d3ee" stroke="#050506" stroke-width="2"/></g></svg>
  <h1>RAYTANKS</h1><p class="sub">Ricochet tank duels. One of you. Elite AI.</p></div>
  <section class="panel"><div class="head"><h2>Opponents</h2><span id="cnt"></span></div><div id="grid"></div></section>
  <section class="panel"><div class="head"><h2>Difficulty</h2></div><div class="seg" id="seg"><div class="thumb" id="th"></div></div></section>
  <section class="panel row"><div><h2>Learning Camp</h2><p class="note" style="text-align:left;margin-top:6px">Spar against a chill bot while Echo learns how you play.</p></div><div style="display:flex;gap:8px"><button class="pill" id="camp">Enter camp</button><button class="pill" id="wipe">Reset Echo</button></div></section>
  <button class="play" id="play">PLAY</button>
  <p class="note">You choose your controls (WASD + Q, or arrows + Space) and whether the AIs fight each other right before the match.</p>
</main>
<script>
const AIS=[['rex','Rex','Hunter','#ff5a52','Relentless. Runs you down through the maze.'],['vex','Vex','Sniper','#ffc233','Calculates ricochet shots before it fires.'],
['zip','Zip','Phantom','#a67bff','Dodges almost everything. Hard to pin down.'],['ash','Ash','Ambusher','#2fd08a','Cuts you off at your favorite spots.'],
['echo','Echo','Training AI','#ff7ad9','Learns your moves and plays like you, with deadly aim.']];
const LV=['Chill','Normal','Hard','Unbeatable'];
let cfg={ai:['rex','vex','zip','ash'],d:2};try{Object.assign(cfg,JSON.parse(localStorage.raytanks_cfg))}catch(e){}
let AC;const au=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function snd(f,d=.09,v=.12,sl=0){try{const c=au(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const $=id=>document.getElementById(id),save=()=>{try{localStorage.raytanks_cfg=JSON.stringify(cfg)}catch(e){}};
let mem=0;try{mem=JSON.parse(localStorage.raytanks_mem||'[]').length}catch(e){}
function render(){
 $('grid').innerHTML=AIS.map(a=>`<button class="card ${cfg.ai.includes(a[0])?'on':''}" data-id="${a[0]}" style="--c:${a[3]}"><b><i></i>${a[1]}<em>${a[2]}</em></b><p>${a[4]}${a[0]==='echo'?' ('+(mem>40?mem+' moves learned':'play the camp to train it')+')':''}</p></button>`).join('');
 $('seg').innerHTML='<div class="thumb" id="th"></div>'+LV.map((l,i)=>`<button data-d="${i}" class="${cfg.d===i?'on':''}">${l}</button>`).join('');$('th').style.transform=`translateX(${cfg.d*100}%)`;
 const n=cfg.ai.length;$('cnt').className=n?'':'bad';$('cnt').textContent=n?n+(n>1?' opponents':' opponent')+' selected':'Pick at least one';
}
document.addEventListener('click',e=>{const c=e.target.closest('.card'),s=e.target.closest('.seg button');
 if(c){const id=c.dataset.id;cfg.ai=cfg.ai.includes(id)?cfg.ai.filter(x=>x!==id):[...cfg.ai,id];snd(cfg.ai.includes(id)?680:440,.1,.14);save();render()}
 if(s){cfg.d=+s.dataset.d;snd(480+cfg.d*90,.1,.14);save();render()}});
$('play').onclick=()=>{if(!cfg.ai.length){snd(180,.25,.12,-60);$('grid').classList.remove('shake');void $('grid').offsetWidth;$('grid').classList.add('shake');return}
 [523,659,784].forEach((f,i)=>setTimeout(()=>snd(f,.16,.14),i*70));setTimeout(()=>location.href='Game/index.html?ai='+cfg.ai.join(',')+'&d='+cfg.d,260)};
$('camp').onclick=()=>{snd(620,.14,.14,200);setTimeout(()=>location.href='Game/index.html?ai=rex,zip&d=0&camp=1',180)};
$('wipe').onclick=()=>{try{localStorage.removeItem('raytanks_mem');localStorage.removeItem('raytanks_heat')}catch(e){}mem=0;snd(220,.25,.1,-80);render()};
render();
</script>
</body>
</html>
